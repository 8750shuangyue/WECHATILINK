# 安装位置：/etc/nginx/conf.d/ilink-rate-limit.conf
# 该文件必须位于 http {} 上下文（Ubuntu 的 conf.d/*.conf 默认被 include 到 http 中）。
#
# 第一轮上线建议同时打开 dry-run（步骤见 deploy/nginx/README.md），
# 观察 24 小时 error.log 后再删除下面两行正式生效。
# limit_req_dry_run on;
# limit_conn_dry_run on;

limit_req_zone $binary_remote_addr zone=ilink_login:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=ilink_register:10m rate=6r/m;
# AI/对话阈值放宽：单用户快速连发十几条消息不应被误伤
limit_req_zone $binary_remote_addr zone=ilink_ai:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=ilink_ai_stream:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=ilink_upload:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=ilink_api:10m rate=300r/m;

limit_conn_zone $binary_remote_addr zone=ilink_ai_conn:10m;
limit_conn_zone $binary_remote_addr zone=ilink_stream_conn:10m;
limit_conn_zone $binary_remote_addr zone=ilink_api_conn:10m;

limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;
limit_conn_log_level warn;
