spring.application.name=demo
# Local secrets are loaded from this file (gitignored); other environments use env vars
spring.config.import=optional:file:./application-local.properties

# DeepSeek V4-Pro 配置（主对话模型）
dashscope.api-key=${DASHSCOPE_API_KEY:}
dashscope.base-url=https://api.deepseek.com/v1
dashscope.model=deepseek-v4-pro

# DashScope Embedding 配置（独立的向量嵌入服务）
dashscope.embedding.api-key=${DASHSCOPE_EMBEDDING_API_KEY:}
dashscope.embedding.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
dashscope.embedding-model=text-embedding-v2
dashscope.embedding.batch-enabled=${DASHSCOPE_EMBEDDING_BATCH_ENABLED:true}
dashscope.embedding.batch-size=${DASHSCOPE_EMBEDDING_BATCH_SIZE:10}
dashscope.embedding.max-attempts=${DASHSCOPE_EMBEDDING_MAX_ATTEMPTS:3}
dashscope.embedding.retry-backoff-ms=${DASHSCOPE_EMBEDDING_RETRY_BACKOFF_MS:500}
dashscope.embedding.timeout-seconds=${DASHSCOPE_EMBEDDING_TIMEOUT_SECONDS:30}



dashscope.vision.model=qwen-vl-plus
dashscope.vision.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
dashscope.vision.api-key=${dashscope.embedding.api-key}

dashscope.image.base-url=https://ws-bvf49eqmthuay53w.cn-beijing.maas.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation
dashscope.image.default-resolution=1024*1024
dashscope.image.default-style=
dashscope.image.model=qwen-image-2.0
dashscope.image.api-key=${dashscope.embedding.api-key}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.web.resources.static-locations=classpath:/static/,file:./uploads/

# ============ Session 与 CORS 安全配置 ============
server.servlet.session.cookie.name=ILINKSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.forward-headers-strategy=framework

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}

chat.memory.max-messages=10
chat.memory.max-tokens=2000
chat.memory.summary-threshold=3000
chat.memory.summary-keep-recent=5

chat.vectorstore.enabled=true
chat.vectorstore.top-k=5
# 向量通道准入下限。2026-10-14 由 0.5 下调到 0.45：离线标定显示 0.5 正好切在
# 相似度分布下尾，6 道零召回题里有 5 道的期望文档其实排在第 1、2 名，只是差一点没够线。
chat.vectorstore.similarity-threshold=0.45
# 关键词通道准入门槛（IDF 加权查询覆盖率，[0,1]）与总开关。开关同时是回滚开关。
chat.vectorstore.keyword-floor=${CHAT_VECTORSTORE_KEYWORD_FLOOR:0.45}
chat.vectorstore.keyword.enabled=${CHAT_VECTORSTORE_KEYWORD_ENABLED:true}

# 重排（DashScope gte-rerank）：默认关闭；canary-users 为空时开启即全量。
# 候选池只从公共知识中取，对话记忆不送外部 API，单独预留 memory-top-k 个名额。
chat.vectorstore.rerank.enabled=${CHAT_VECTORSTORE_RERANK_ENABLED:false}
chat.vectorstore.rerank.candidate-pool-size=${CHAT_VECTORSTORE_RERANK_CANDIDATE_POOL_SIZE:20}
chat.vectorstore.rerank.min-candidates=${CHAT_VECTORSTORE_RERANK_MIN_CANDIDATES:3}
chat.vectorstore.rerank.timeout-ms=${CHAT_VECTORSTORE_RERANK_TIMEOUT_MS:800}
chat.vectorstore.rerank.max-doc-chars=${CHAT_VECTORSTORE_RERANK_MAX_DOC_CHARS:2000}
chat.vectorstore.rerank.max-concurrent=${CHAT_VECTORSTORE_RERANK_MAX_CONCURRENT:2}
chat.vectorstore.rerank.queue-size=${CHAT_VECTORSTORE_RERANK_QUEUE_SIZE:8}
chat.vectorstore.rerank.canary-users=${CHAT_VECTORSTORE_RERANK_CANARY_USERS:}
chat.vectorstore.memory-top-k=${CHAT_VECTORSTORE_MEMORY_TOP_K:2}

dashscope.rerank.api-key=${DASHSCOPE_RERANK_API_KEY:${dashscope.embedding.api-key}}
dashscope.rerank.base-url=${DASHSCOPE_RERANK_BASE_URL:https://dashscope.aliyuncs.com/api/v1}
dashscope.rerank.model=${DASHSCOPE_RERANK_MODEL:gte-rerank-v2}

# 上下文压缩：默认关闭；只做公共知识块的确定性抽取，记忆逐字保留。
chat.rag.compression.enabled=${CHAT_RAG_COMPRESSION_ENABLED:false}
chat.rag.compression.mode=${CHAT_RAG_COMPRESSION_MODE:extractive}
chat.rag.compression.max-chars-per-chunk=${CHAT_RAG_COMPRESSION_MAX_CHARS_PER_CHUNK:360}
chat.rag.compression.min-chars-to-compress=${CHAT_RAG_COMPRESSION_MIN_CHARS_TO_COMPRESS:420}
chat.rag.compression.cache-size=${CHAT_RAG_COMPRESSION_CACHE_SIZE:512}
chat.rag.compression.protect-safety-sentences=${CHAT_RAG_COMPRESSION_PROTECT_SAFETY_SENTENCES:true}
chat.rag.compression.canary-users=${CHAT_RAG_COMPRESSION_CANARY_USERS:}
app.data-governance.enabled=${APP_DATA_GOVERNANCE_ENABLED:false}

# 消息/摘要生命周期：独立开关，默认关闭，避免部署即开始归档生产数据
app.message-lifecycle.enabled=${APP_MESSAGE_LIFECYCLE_ENABLED:false}
app.message-lifecycle.archive-retention-days=180
app.message-lifecycle.archive-cleanup-cron=0 40 3 * * *
app.message-lifecycle.archive-cleanup-batch-size=1000
app.message-lifecycle.archive-cleanup-max-batches=10
app.message-lifecycle.max-messages-per-run=200
app.message-lifecycle.summary-lock-ttl-seconds=600
app.message-lifecycle.summary-max-attempts=10
app.message-lifecycle.summary-retry-cron=0 */10 * * * *
app.message-lifecycle.summary-retry-base-delay-seconds=30
app.message-lifecycle.summary-retry-max-delay-seconds=21600
app.message-lifecycle.summary-retry-limit=50
chat.vectorstore.duplicate-cleanup-cron=0 0 4 * * *
chat.vectorstore.conversation-retention-days=90
chat.vectorstore.conversation-retention-cleanup-cron=0 15 4 * * *
community.vector-governance.orphan-cleanup-cron=0 30 3 * * *

# RAG 审计日志保留周期；小于等于 0 时关闭对应自动清理
rag.retention.retrieval-log-days=180
rag.retention.observability-access-log-days=180
rag.retention.cleanup-cron=0 30 4 * * *

# RAG 受控只读观测接口（默认关闭；allowed-users 使用逗号分隔）
app.rag-observability.enabled=${APP_RAG_OBSERVABILITY_ENABLED:false}
app.rag-observability.allowed-users=${APP_RAG_OBSERVABILITY_ALLOWED_USERS:}

spring.datasource.url=jdbc:mysql://localhost:3306/ilink_chat?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.secondary.url=${RAG_DB_PATH:jdbc:sqlite:rag_knowledge.sqlite}
spring.datasource.secondary.driver-class-name=org.sqlite.JDBC

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

weather.api.base-url=https://api.seniverse.com/v3/weather/daily.json
weather.api.api-key=${SENIVERSE_API_KEY:}
weather.api.connect-timeout=5000
weather.api.read-timeout=10000
weather.api.write-timeout=5000

# 高德地图配置
amap.api-key=${AMAP_API_KEY:}
amap.base-url=https://restapi.amap.com/v3
amap.web-nav-base-url=https://uri.amap.com

xunfei.tts.app-id=${XUNFEI_TTS_APP_ID:4984ac70}
xunfei.tts.api-key=${XUNFEI_TTS_API_KEY:}
xunfei.tts.api-secret=${XUNFEI_TTS_API_SECRET:}
xunfei.tts.vcn=xiaoyan
xunfei.tts.aue=lame
xunfei.tts.sample-rate=16000
xunfei.tts.speed=50
xunfei.tts.volume=50
xunfei.tts.pitch=50

dashscope.asr.model=fun-asr-realtime-2026-02-28
dashscope.asr.sample-rate=16000
dashscope.asr.format=wav

audio.converter.ffmpeg-path=ffmpeg

# 百度搜索API配置
baidu.search.api-key=${BAIDU_SEARCH_API_KEY:}
baidu.search.api-url=https://api.baidu.com/api/snc/v1/search

spring.ai.openai.base-url=https://api.deepseek.com
spring.ai.openai.api-key=${DASHSCOPE_API_KEY:}
spring.ai.openai.chat.model=deepseek-v4-pro
spring.ai.openai.chat.temperature=0.3

# ============ WebPush 配置 ============
# 使用以下命令生成VAPID密钥对（需要安装web-push CLI）:
# npm install -g web-push && web-push generate-vapid-keys
webpush.vapid.public-key=${WEBPUSH_VAPID_PUBLIC_KEY:}
webpush.vapid.private-key=${WEBPUSH_VAPID_PRIVATE_KEY:}
webpush.vapid.subject=mailto:admin@sekaipetplant.com

# ============ 任务调度配置 ============
# 简报、护理提醒、库存检查等定时任务分离线程，避免共用单线程调度器互相阻塞
spring.task.scheduling.pool.size=3
spring.task.scheduling.thread-name-prefix=scheduled-task-

