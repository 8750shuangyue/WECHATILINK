<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面不存在 - Sekai PetPlant</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐾%3C/text%3E%3C/svg%3E">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            font-family: "Inter","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
            color: #1c2b22; text-align: center; padding: 24px;
            background:
                radial-gradient(900px 480px at 80% -10%, rgba(42,157,143,.16), transparent 60%),
                radial-gradient(700px 400px at -10% 110%, rgba(47,158,99,.13), transparent 55%),
                linear-gradient(165deg,#f7fbf8,#eef6f1);
            background-attachment: fixed;
        }
        .box { max-width: 460px; }
        .code { font-size: 96px; font-weight: 800; background: linear-gradient(120deg,#14532d,#2a9d8f); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .msg { font-size: 20px; font-weight: 700; margin: 12px 0 8px; color: #14532d; }
        .desc { color: #5b6f63; font-size: 14px; line-height: 1.7; margin-bottom: 24px; }
        .btn {
            display: inline-block; padding: 12px 28px; border-radius: 999px;
            background: linear-gradient(135deg,#2f9e63,#1e8a50 55%,#2a9d8f); color: #fff;
            text-decoration: none; font-size: 15px; font-weight: 700;
            box-shadow: 0 8px 18px rgba(30,138,80,.26); transition: .2s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(30,138,80,.34); }
    </style>
</head>
<body>
<div class="box">
    <div class="code">404</div>
    <div class="msg">页面走丢了</div>
    <div class="desc">你访问的页面不存在或已被移动，回到首页继续逛逛吧。</div>
    <a class="btn" href="/home">🐾 返回首页</a>
</div>
</body>
</html>
