<script src="/js/guard.js?v=20261110a"></script>
<script src="/js/common.js?v=20261110a"></script>
<script>
document.getElementById('todayDate').textContent = new Date().toLocaleDateString('zh-CN', {
    year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
});

requireLogin(function (data) {
    var name = data.userName || data.user || '';
    document.getElementById('greetingName').textContent = name;
    if (window.setShellUser) window.setShellUser(name);
    loadOverview();
    checkPushStatus();
});

async function loadOverview() {
    const results = await Promise.allSettled([
        UI.apiJson('/api/care/targets/PLANT'),
        UI.apiJson('/api/care/targets/PET'),
        UI.apiJson('/api/ai/care/reminders/pending'),
        UI.apiJson('/api/ai/care/reminders')
    ]);

    // 植物 / 宠物档案数
    try {
        const plant = results[0].value;
        if (plant.code === 200) document.getElementById('plantCount').textContent = (plant.data || []).length;
    } catch (e) { /* 保持占位 */ }

    try {
        const pet = results[1].value;
        if (pet.code === 200) document.getElementById('petCount').textContent = (pet.data || []).length;
    } catch (e) { /* 保持占位 */ }

    // 待办数量
    try {
        const pending = results[2].value;
        if (pending.success) document.getElementById('pendingCount').textContent = pending.count;
    } catch (e) { /* 保持占位 */ }

    // 最近一条待办
    try {
        const list = results[3].value;
        renderNextReminder((list && list.data) || []);
    } catch (e) {
        document.getElementById('nextReminder').textContent = '暂时无法获取提醒，点这里去提醒页查看。';
    }
}

function parseDue(value) {
    if (!value) return null;
    const text = String(value).replace(' ', 'T').replace(/\.\d+$/, '');
    const date = new Date(text);
    return isNaN(date.getTime()) ? null : date;
}

function formatDue(date) {
    if (!date) return '';
    const now = new Date();
    const hh = String(date.getHours()).padStart(2, '0');
    const mm = String(date.getMinutes()).padStart(2, '0');
    const time = hh + ':' + mm;
    if (date.toDateString() === now.toDateString()) return '今天 ' + time;
    const tomorrow = new Date(now);
    tomorrow.setDate(now.getDate() + 1);
    if (date.toDateString() === tomorrow.toDateString()) return '明天 ' + time;
    return (date.getMonth() + 1) + '月' + date.getDate() + '日 ' + time;
}

function renderNextReminder(rows) {
    const el = document.getElementById('nextReminder');
    const pending = (rows || [])
        .filter(r => r && r.status === 'PENDING' && parseDue(r.due_at))
        .sort((a, b) => parseDue(a.due_at) - parseDue(b.due_at));

    if (!pending.length) {
        el.textContent = '今天没有待办提醒，去护理页记录一次吧。';
        return;
    }

    const next = pending[0];
    const due = parseDue(next.due_at);
    const overdue = due.getTime() < Date.now();
    const when = formatDue(due);
    el.textContent = (next.reminder_type ? next.reminder_type + ' · ' : '') +
        (next.content || '护理提醒') + ' · ' + when + (overdue ? '（已到期）' : '');
}

// Push
async function checkPushStatus() {
    const toggle = document.getElementById('pushToggle');
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
        toggle.disabled = true;
        return;
    }
    try {
        const reg = await UI.sw.getRegistration();
        if (!reg) { toggle.disabled = true; return; }
        const sub = await reg.pushManager.getSubscription();
        toggle.checked = !!sub;
    } catch (e) {}
}

async function togglePush() {
    const toggle = document.getElementById('pushToggle');
    try {
        const reg = await UI.sw.getRegistration();
        if (!reg) throw new Error('service worker unavailable');

        if (toggle.checked) {
            const sub = await reg.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: UI.sw.applicationServerKey()
            });
            const data = await UI.apiJson('/api/push/subscribe', {
                method: 'POST',
                body: UI.sw.payload(sub)
            });
            if (data.code !== 200) throw new Error(data.message || 'subscribe failed');
        } else {
            const sub = await reg.pushManager.getSubscription();
            if (sub) {
                await sub.unsubscribe();
                await UI.apiJson('/api/push/unsubscribe', {
                    method: 'DELETE',
                    body: { endpoint: sub.endpoint }
                });
            }
        }
    } catch (e) {
        toggle.checked = !toggle.checked;
    }
}

</script>
</body>
</html>
