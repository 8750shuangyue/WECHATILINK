<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>库存管理 - Sekai PetPlant</title>
    <link rel="stylesheet" href="/css/app.css">
    <style>
        /* ===== Reset & Base ===== */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #f0f2f5; color: #2c3e50; min-height: 100vh; }

        /* ===== Topbar ===== */
        .topbar { background: linear-gradient(135deg, #1a252f 0%, #2c3e50 40%, #34495e 100%);
            color: #fff; padding: 14px 28px; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 2px 16px rgba(0,0,0,0.15); position: sticky; top: 0; z-index: 100; }
        .topbar-brand { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; }
        .topbar-right { display: flex; align-items: center; gap: 16px; font-size: 14px; }
        .topbar-right a { color: #ecf0f1; text-decoration: none; transition: color 0.2s; }
        .topbar-right a:hover { color: #fff; }
        .text-btn { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25);
            color: #fff; padding: 6px 16px; border-radius: 20px; cursor: pointer; font-size: 13px;
            transition: all 0.2s; }
        .text-btn:hover { background: rgba(255,255,255,0.22); }

        /* ===== Container ===== */
        .inv-container { max-width: 960px; margin: 0 auto; padding: 24px 20px 40px; }

        /* ===== Header ===== */
        .inv-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .inv-header h2 { font-size: 22px; font-weight: 700; color: #2c3e50; display: flex; align-items: center; gap: 10px; }
        .inv-header h2 .icon { font-size: 26px; }
        .add-btn { background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            color: #fff; border: none; padding: 10px 22px; border-radius: 24px; font-size: 14px;
            font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px;
            box-shadow: 0 3px 12px rgba(39,174,96,0.3); transition: all 0.25s; }
        .add-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(39,174,96,0.4); }
        .add-btn:active { transform: translateY(0); }

        /* ===== Alerts Banner ===== */
        .alerts-banner { background: linear-gradient(135deg, #fff8e1 0%, #fff3e0 50%, #ffe0b2 100%);
            border: 1px solid #ffb74d; border-left: 5px solid #f57c00; border-radius: 12px;
            padding: 14px 18px; margin-bottom: 20px; display: none;
            box-shadow: 0 4px 20px rgba(245,124,0,0.12); }
        .alerts-banner.active { display: block; animation: bounceInDown 0.55s cubic-bezier(0.215, 0.61, 0.355, 1); }
        .alerts-banner h4 { margin: 0 0 10px 0; color: #e65100; font-size: 15px; font-weight: 700; }
        .alert-item { font-size: 13px; color: #bf360c; margin: 5px 0; display: flex; align-items: center;
            gap: 6px; flex-wrap: wrap; }
        .alert-item .alert-dot { width: 8px; height: 8px; border-radius: 50%; background: #f44336;
            flex-shrink: 0; animation: alertDotPulse 2s infinite; }
        .alert-item a { color: #1565c0; font-weight: 600; text-decoration: none;
            padding: 2px 10px; border-radius: 12px; background: #e3f2fd; font-size: 12px;
            margin-left: 4px; transition: all 0.2s; }
        .alert-item a:hover { background: #bbdefb; }

        /* ===== Category Tabs ===== */
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab { padding: 7px 18px; border-radius: 22px; font-size: 13px; cursor: pointer;
            background: #fff; border: 1.5px solid #e0e0e0; color: #666; font-weight: 500;
            transition: all 0.25s; user-select: none; display: flex; align-items: center; gap: 6px; }
        .tab:hover { border-color: #bdbdbd; color: #333; }
        .tab.active { background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: #fff; border-color: transparent; box-shadow: 0 3px 10px rgba(44,62,80,0.35); }
        .tab-dot { display: inline-flex; align-items: center; justify-content: center;
            min-width: 18px; height: 18px; border-radius: 9px; font-size: 10px; font-weight: 700;
            background: #e8e8e8; color: #888; padding: 0 6px; line-height: 1;
            transition: all 0.25s; }
        .tab.active .tab-dot { background: rgba(255,255,255,0.25); color: #fff; }

        /* ===== Item Cards ===== */
        .items-grid { display: flex; flex-direction: column; gap: 12px; }
        .item-card { background: linear-gradient(135deg, #fdfdfd 0%, #f8f9fb 50%, #f4f5f7 100%);
            border-radius: 12px; padding: 18px 20px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05), 0 0 0 1px rgba(0,0,0,0.03);
            display: flex; justify-content: space-between;
            align-items: center; border-left: 4px solid #e0e0e0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative; animation: fadeInUp 0.4s ease forwards; }
        .item-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08), 0 0 0 1px rgba(0,0,0,0.04);
            transform: translateY(-2px); }
        .item-card.removing { animation: slideOutRight 0.35s ease forwards; pointer-events: none; }

        /* Category colored borders */
        .item-card.cat-PET_FOOD { border-left-color: #43a047; }
        .item-card.cat-CAT_LITTER { border-left-color: #5c6bc0; }
        .item-card.cat-MEDICINE { border-left-color: #ef5350; }
        .item-card.cat-SUPPLEMENT { border-left-color: #ab47bc; }
        .item-card.cat-FERTILIZER { border-left-color: #795548; }
        .item-card.cat-SOIL { border-left-color: #8d6e63; }
        .item-card.cat-PESTICIDE { border-left-color: #ff7043; }
        .item-card.cat-TREAT { border-left-color: #ec407a; }
        .item-card.cat-TOY { border-left-color: #fdd835; }
        .item-card.cat-OTHER { border-left-color: #90a4ae; }

        /* Low stock highlight */
        .item-card.low-stock { border-left-width: 5px; border-left-color: #d32f2f !important;
            box-shadow: 0 1px 8px rgba(211,47,47,0.12); background: linear-gradient(135deg, #fff5f5 0%, #fef0f0 50%, #fde8e8 100%);
            animation: attentionPulse 2.5s ease-in-out infinite; }
        .item-card.low-stock .low-stock-icon { display: inline-flex !important; }

        .item-info { flex: 1; min-width: 0; }
        .item-name-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
        .item-name { font-size: 16px; font-weight: 600; color: #2c3e50; }
        .category-badge { display: inline-flex; align-items: center; padding: 2px 10px;
            border-radius: 12px; font-size: 11px; font-weight: 500; white-space: nowrap; }
        .badge-PET_FOOD { background: #e8f5e9; color: #2e7d32; }
        .badge-CAT_LITTER { background: #e8eaf6; color: #283593; }
        .badge-MEDICINE { background: #ffebee; color: #c62828; }
        .badge-SUPPLEMENT { background: #f3e5f5; color: #6a1b9a; }
        .badge-FERTILIZER { background: #efebe9; color: #4e342e; }
        .badge-SOIL { background: #efebe9; color: #5d4037; }
        .badge-PESTICIDE { background: #fbe9e7; color: #bf360c; }
        .badge-TREAT { background: #fce4ec; color: #880e4f; }
        .badge-TOY { background: #fffde7; color: #f57f17; }
        .badge-OTHER { background: #eceff1; color: #37474f; }

        .low-stock-icon { display: none !important; color: #d32f2f; font-size: 14px;
            align-items: center; animation: pulse 1.5s infinite; }

        .item-meta { font-size: 13px; color: #78909c; margin-top: 3px; line-height: 1.5; }
        .item-meta .days-info { color: #2e7d32; font-weight: 500; }

        .item-status { text-align: right; flex-shrink: 0; min-width: 160px; }
        .quantity-display { font-size: 22px; font-weight: 700; color: #2c3e50; }
        .quantity-display .unit-text { font-size: 13px; font-weight: 400; color: #90a4ae; margin-left: 2px; }

        /* Progress bar */
        .progress-wrap { margin-top: 8px; }
        .progress-bar { width: 100%; height: 7px; background: #e8eaed; border-radius: 4px;
            overflow: hidden; position: relative; }
        .progress-fill { height: 100%; border-radius: 4px; transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative; }
        .progress-fill.bar-green { background: linear-gradient(90deg, #43a047 0%, #66bb6a 50%, #81c784 100%); }
        .progress-fill.bar-orange { background: linear-gradient(90deg, #ef6c00 0%, #ff9800 50%, #ffb74d 100%); }
        .progress-fill.bar-red { background: linear-gradient(90deg, #c62828 0%, #e53935 50%, #ef5350 100%); }
        .progress-fill.shimmer::after {
            content: ''; position: absolute; top: 0; left: -100%; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
            animation: shimmer 1.8s infinite;
        }
        .progress-label { font-size: 11px; color: #90a4ae; margin-top: 3px; text-align: right; }

        /* Action buttons */
        .item-actions { display: flex; gap: 6px; margin-top: 10px; justify-content: flex-end; flex-wrap: wrap; }
        .btn-sm { padding: 5px 14px; border: none; border-radius: 16px; font-size: 12px;
            font-weight: 500; cursor: pointer; transition: all 0.2s; }
        .btn-sm:hover { transform: translateY(-1px); }
        .btn-sm:active { transform: translateY(0); }
        .btn-consume { background: linear-gradient(135deg, #fff3e0, #ffe0b2); color: #e65100; }
        .btn-consume:hover { background: linear-gradient(135deg, #ffe0b2, #ffcc80); box-shadow: 0 2px 8px rgba(230,81,0,0.15); }
        .btn-edit { background: linear-gradient(135deg, #e3f2fd, #bbdefb); color: #1565c0; }
        .btn-edit:hover { background: linear-gradient(135deg, #bbdefb, #90caf9); box-shadow: 0 2px 8px rgba(21,101,192,0.15); }
        .btn-delete { background: linear-gradient(135deg, #ffebee, #ffcdd2); color: #c62828; }
        .btn-delete:hover { background: linear-gradient(135deg, #ffcdd2, #ef9a9a); box-shadow: 0 2px 8px rgba(198,40,40,0.15); }

        /* ===== Empty State ===== */
        .empty-state { text-align: center; padding: 60px 20px; color: #b0bec5; }
        .empty-state .empty-icon { font-size: 56px; margin-bottom: 12px; }
        .empty-state p { font-size: 15px; }

        /* ===== Modal ===== */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.45); z-index: 1000; justify-content: center; align-items: center;
            backdrop-filter: blur(3px); }
        .modal-overlay.active { display: flex; animation: fadeIn 0.25s ease; }
        .modal { background: #fff; border-radius: 16px; padding: 28px 24px; width: 92%;
            max-width: 500px; max-height: 85vh; overflow-y: auto;
            box-shadow: 0 16px 48px rgba(0,0,0,0.18); animation: scaleIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .modal h3 { font-size: 18px; font-weight: 700; color: #2c3e50; margin: 0 0 20px 0;
            padding-bottom: 14px; border-bottom: 1px solid #eee; }
        .modal .consume-item-name { font-weight: 600; color: #2c3e50; font-size: 15px; margin-bottom: 16px; }

        /* Modal stepper sections */
        .modal-section { margin-bottom: 8px; }
        .modal-section-header { font-size: 12px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 1.2px; color: #90a4ae; margin-bottom: 12px; padding-bottom: 6px;
            border-bottom: 2px solid #f0f0f0; display: flex; align-items: center; gap: 8px; }
        .modal-section-header::before { content: ''; width: 20px; height: 20px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
        .modal-section-header.section-required::before { content: '*'; background: #e8f5e9; color: #2e7d32; }
        .modal-section-header.section-optional::before { content: '?'; background: #f5f5f5; color: #9e9e9e; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #546e7a;
            margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 9px 14px;
            border: 1.5px solid #e0e0e0; border-radius: 10px; font-size: 14px;
            color: #2c3e50; background: #fafafa; transition: all 0.2s; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #42a5f5;
            background: #fff; box-shadow: 0 0 0 3px rgba(66,165,245,0.1); }
        .form-group input::placeholder { color: #bdbdbd; }
        .form-row { display: flex; gap: 14px; }
        .form-row .form-group { flex: 1; }

        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px;
            padding-top: 16px; border-top: 1px solid #eee; }
        .btn { padding: 9px 22px; border-radius: 10px; font-size: 14px; font-weight: 600;
            border: none; cursor: pointer; transition: all 0.2s; }
        .btn-cancel { background: #f5f5f5; color: #757575; }
        .btn-cancel:hover { background: #e0e0e0; }
        .btn-save { background: linear-gradient(135deg, #43a047 0%, #66bb6a 100%);
            color: #fff; box-shadow: 0 3px 12px rgba(67,160,71,0.25); }
        .btn-save:hover { box-shadow: 0 6px 18px rgba(67,160,71,0.35); transform: translateY(-1px); }
        .btn-confirm { background: linear-gradient(135deg, #ef6c00 0%, #ff9800 100%);
            color: #fff; box-shadow: 0 3px 12px rgba(239,108,0,0.25); }
        .btn-confirm:hover { box-shadow: 0 6px 18px rgba(239,108,0,0.35); transform: translateY(-1px); }

        /* ===== Toast ===== */
        .toast-container { position: fixed; top: 80px; right: 24px; z-index: 2000;
            display: flex; flex-direction: column; gap: 8px; }
        .toast { background: #fff; border-radius: 10px; padding: 12px 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15); font-size: 14px; font-weight: 500;
            display: flex; align-items: center; gap: 8px; animation: slideInRight 0.3s ease;
            max-width: 360px; }
        .toast.success { border-left: 4px solid #43a047; color: #2e7d32; }
        .toast.error { border-left: 4px solid #e53935; color: #c62828; }
        .toast.info { border-left: 4px solid #1e88e5; color: #1565c0; }
        .toast.removing { animation: slideOutRight 0.3s ease forwards; }

        /* ===== Animations ===== */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeOutLeft {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(-20px); }
        }
        @keyframes slideOutRight {
            from { opacity: 1; transform: translateX(0); max-height: 200px; margin-bottom: 12px; }
            to { opacity: 0; transform: translateX(60px); max-height: 0; margin-bottom: 0; padding-top: 0; padding-bottom: 0; }
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(80px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes bounceInDown {
            0% { opacity: 0; transform: translateY(-24px); }
            50% { opacity: 1; transform: translateY(6px); }
            70% { transform: translateY(-4px); }
            85% { transform: translateY(2px); }
            100% { transform: translateY(0); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        @keyframes alertDotPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.4); }
        }
        @keyframes attentionPulse {
            0%, 100% { box-shadow: 0 1px 8px rgba(211,47,47,0.12); }
            50% { box-shadow: 0 2px 18px rgba(211,47,47,0.28), 0 0 0 2px rgba(211,47,47,0.08); }
        }
        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        /* ===== Responsive ===== */
        @media (max-width: 600px) {
            .inv-container { padding: 16px 12px 32px; }
            .item-card { flex-direction: column; align-items: stretch; padding: 14px; }
            .item-status { text-align: left; margin-top: 10px; }
            .item-actions { justify-content: flex-start; }
            .form-row { flex-direction: column; gap: 0; }
            .modal { padding: 20px 16px; }
            .toast-container { right: 8px; left: 8px; }
            .toast { max-width: 100%; }
        }
    </style>
    <style>
        /* ===== 新设计系统覆盖层 v2 ===== */
        :root {
            --green-50:#f2f9f4; --green-100:#dff0e6; --green-500:#2f9e63;
            --green-600:#1e8a50; --green-700:#126a3c; --teal:#2a9d8f;
            --ink:#1c2b22; --ink-2:#5b6f63; --line:rgba(28,60,44,.1);
            --grad:linear-gradient(135deg,#2f9e63,#1e8a50 55%,#2a9d8f);
            --shadow:0 10px 30px rgba(20,60,40,.1);
            --radius:18px;
        }
        body {
            font-family:"Inter","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
            background:
                radial-gradient(1000px 520px at 85% -10%, rgba(42,157,143,.14), transparent 60%),
                radial-gradient(900px 480px at -10% 110%, rgba(47,158,99,.12), transparent 55%),
                linear-gradient(165deg,#f7fbf8,#eef6f1) !important;
            background-attachment:fixed; color:var(--ink);
            -webkit-font-smoothing:antialiased;
        }
        ::selection{background:rgba(47,158,99,.22)}
        .topbar{
            background:rgba(255,255,255,.88) !important; color:var(--ink) !important;
            backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
            border-bottom:1px solid var(--line); box-shadow:0 4px 18px rgba(20,60,40,.06);
        }
        .topbar-brand{color:var(--green-700) !important; font-weight:800; letter-spacing:.3px}
        .topbar-right{color:var(--ink-2)}
        .disease-main,.inv-container{max-width:1180px; margin:28px auto 60px; padding:0 20px}
        .mode-tabs,.tabs{display:flex; gap:8px; flex-wrap:wrap}
        .mode-tab,.tabs button,.nav button{
            border:0; padding:10px 18px; border-radius:999px; cursor:pointer;
            font-size:15px; font-weight:600; color:var(--ink-2); background:transparent; transition:.2s;
        }
        .mode-tab.active,.tabs button.active{background:var(--grad); color:#fff; box-shadow:0 6px 16px rgba(30,138,80,.3)}
        .mode-tab:hover,.tabs button:hover,.nav button:hover{background:var(--green-100); color:var(--green-600)}
        .upload-section,.upload-area,.result-section,.history-section,.panel,.inv-header,.alerts-banner{
            background:#fff; border:1px solid var(--line); border-radius:var(--radius);
            box-shadow:var(--shadow); padding:24px;
        }
        .upload-area,.upload-section{border-style:dashed; border-color:rgba(47,158,99,.4); background:var(--green-50)}
        .upload-icon{font-size:42px}
        .result-field,.history-item,.item-card,.item-info,.field-value,.hist-summary{
            background:#fff; border:1px solid var(--line); border-radius:14px;
            box-shadow:0 2px 10px rgba(20,60,40,.06); padding:16px;
        }
        .history-item,.item-card{transition:.25s}
        .history-item:hover,.item-card:hover{transform:translateY(-3px); border-color:rgba(47,158,99,.35)}
        .field-label,.hist-time,.item-meta,.hint,.disclaimer{color:var(--ink-2)}
        input,select,textarea{
            border:1.5px solid var(--line) !important; border-radius:11px !important;
            padding:11px 14px !important; font:inherit; color:var(--ink); background:#fbfdfc; outline:none; transition:.2s;
        }
        input:focus,select:focus,textarea:focus{border-color:var(--green-500) !important; background:#fff; box-shadow:0 0 0 4px rgba(47,158,99,.12)}
        .diag-btn,.clear-btn,.btn,.btn-save,.btn-confirm,.btn-consume,.primary,.add-btn{
            border:0; border-radius:11px; padding:11px 18px; cursor:pointer;
            font-size:14px; font-weight:700; transition:.2s;
        }
        .diag-btn,.btn,.btn-save,.btn-confirm,.btn-consume,.primary,.add-btn{
            background:var(--grad); color:#fff; box-shadow:0 8px 18px rgba(30,138,80,.26);
        }
        .diag-btn:hover,.btn:hover,.btn-save:hover,.btn-confirm:hover,.btn-consume:hover,.primary:hover,.add-btn:hover{
            transform:translateY(-1px); box-shadow:0 12px 24px rgba(30,138,80,.34);
        }
        .clear-btn,.btn-cancel,.btn-delete,.btn-edit,.btn-sm,.minor,.danger{
            background:var(--green-50); color:var(--green-700); border:1px solid var(--green-100);
        }
        .clear-btn:hover,.btn-cancel:hover,.btn-delete:hover,.btn-edit:hover,.btn-sm:hover,.minor:hover,.danger:hover{background:var(--green-100)}
        .confidence-badge,.category-badge{background:var(--grad); color:#fff; border-radius:999px; padding:4px 12px; font-weight:700}
        .item-status{font-weight:700}
        .empty-state{color:var(--ink-2); text-align:center; padding:32px}
        .empty-icon{font-size:40px}
        .modal-overlay,.modal{
            background:rgba(20,40,30,.5); backdrop-filter:blur(4px);
        }
        .toast-container{position:fixed; right:24px; bottom:24px; z-index:100}
        @media (max-width:860px){ .topbar{padding:0 14px} }
        @media (prefers-reduced-motion: reduce){ *{transition:none !important} }
    </style>

<body>
<header class="topbar">
    <div class="topbar-brand">📦 库存管理</div>
    <div class="topbar-right">
        <a href="/home">首页</a>
        <a href="/shop">商城</a>
        <span id="greeting"></span>
        <button onclick="logout()" class="text-btn">退出</button>
    </div>
</header>

<div class="inv-container">
    <div class="inv-header">
        <h2><span class="icon">📋</span>库存物品</h2>
        <button class="add-btn" onclick="openAddModal()">
            <span style="font-size:16px;">+</span> 添加物品
        </button>
    </div>

    <div class="alerts-banner" id="alertsBanner">
        <h4>⚠️ 库存预警</h4>
        <div id="alertsList"></div>
    </div>

    <div class="tabs" id="categoryTabs">
        <button class="tab active" onclick="filterItems('ALL')">全部<span class="tab-dot" id="count-ALL">0</span></button>
        <button class="tab" onclick="filterItems('PET_FOOD')">宠物食品<span class="tab-dot" id="count-PET_FOOD">0</span></button>
        <button class="tab" onclick="filterItems('CAT_LITTER')">猫砂<span class="tab-dot" id="count-CAT_LITTER">0</span></button>
        <button class="tab" onclick="filterItems('MEDICINE')">药品<span class="tab-dot" id="count-MEDICINE">0</span></button>
        <button class="tab" onclick="filterItems('FERTILIZER')">肥料<span class="tab-dot" id="count-FERTILIZER">0</span></button>
        <button class="tab" onclick="filterItems('SUPPLEMENT')">营养品<span class="tab-dot" id="count-SUPPLEMENT">0</span></button>
        <button class="tab" onclick="filterItems('OTHER')">其他<span class="tab-dot" id="count-OTHER">0</span></button>
    </div>

    <div class="items-grid" id="itemsList"></div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="itemModal">
    <div class="modal">
        <h3 id="modalTitle">添加物品</h3>
        <div class="modal-section">
            <div class="modal-section-header section-required">必填信息</div>
            <div class="form-group">
                <label>名称 *</label>
                <input type="text" id="itemName" placeholder="例如：皇家猫粮">
            </div>
            <div class="form-group">
                <label>分类 *</label>
                <select id="itemCategory">
                    <option value="PET_FOOD">宠物食品</option>
                    <option value="CAT_LITTER">猫砂</option>
                    <option value="MEDICINE">药品</option>
                    <option value="SUPPLEMENT">营养品</option>
                    <option value="FERTILIZER">肥料</option>
                    <option value="SOIL">土壤</option>
                    <option value="PESTICIDE">农药</option>
                    <option value="TREAT">零食</option>
                    <option value="TOY">玩具</option>
                    <option value="OTHER">其他</option>
                </select>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>数量 *</label>
                    <input type="number" id="itemQuantity" step="0.01" placeholder="0">
                </div>
                <div class="form-group">
                    <label>单位 *</label>
                    <select id="itemUnit">
                        <option value="公斤">公斤</option>
                        <option value="升">升</option>
                        <option value="包">包</option>
                        <option value="个">个</option>
                        <option value="袋">袋</option>
                        <option value="克">克</option>
                        <option value="毫升">毫升</option>
                        <option value="盒">盒</option>
                        <option value="瓶">瓶</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="modal-section">
            <div class="modal-section-header section-optional">选填信息</div>
            <div class="form-row">
                <div class="form-group">
                    <label>开封日期</label>
                    <input type="date" id="itemOpenDate">
                </div>
                <div class="form-group">
                    <label>每日用量</label>
                    <input type="number" id="itemDailyConsumption" step="0.01" placeholder="克/天">
                </div>
            </div>
            <div class="form-group">
                <label>低库存阈值</label>
                <input type="number" id="itemThreshold" step="0.01" placeholder="低于此值发出预警">
            </div>
            <div class="form-group">
                <label>备注</label>
                <input type="text" id="itemNotes" placeholder="例如：从XX店铺购买">
            </div>
        </div>
        <input type="hidden" id="editItemId">
        <div class="modal-actions">
            <button class="btn btn-cancel" onclick="closeModal()">取消</button>
            <button class="btn btn-save" onclick="saveItem()">保存</button>
        </div>
    </div>
</div>

<!-- Consume Modal -->
<div class="modal-overlay" id="consumeModal">
    <div class="modal">
        <h3>📝 记录消耗</h3>
        <div class="consume-item-name" id="consumeItemName"></div>
        <div class="form-group">
            <label>用量</label>
            <input type="number" id="consumeAmount" step="0.01" placeholder="输入消耗的数量">
        </div>
        <div class="modal-actions">
            <button class="btn btn-cancel" onclick="closeConsumeModal()">取消</button>
            <button class="btn btn-confirm" onclick="confirmConsume()">确认</button>
        </div>
    </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<script>
let allItems = [];
let currentFilter = 'ALL';
let consumeItemId = null;

const catLabels = {
    PET_FOOD: '宠物食品', CAT_LITTER: '猫砂', MEDICINE: '药品',
    SUPPLEMENT: '营养品', FERTILIZER: '肥料', SOIL: '土壤',
    PESTICIDE: '农药', TREAT: '零食', TOY: '玩具', OTHER: '其他'
};

// ===== Greeting =====
function setGreeting() {
    const hour = new Date().getHours();
    let greeting;
    if (hour < 6) greeting = '夜深了';
    else if (hour < 9) greeting = '早上好';
    else if (hour < 12) greeting = '上午好';
    else if (hour < 14) greeting = '中午好';
    else if (hour < 18) greeting = '下午好';
    else greeting = '晚上好';
    fetch('/api/auth/me').then(r => r.json()).then(d => {
        if (d.code === 200) document.getElementById('greeting').textContent = greeting + '，' + d.data.userName;
        else location.href = '/login';
    });
}
setGreeting();

// ===== Toast =====
function showToast(message, type) {
    type = type || 'info';
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = 'toast ' + type;
    const icons = { success: '\u2705', error: '\u274C', info: '\u2139\uFE0F' };
    toast.innerHTML = (icons[type] || '') + ' ' + message;
    container.appendChild(toast);
    setTimeout(() => {
        toast.classList.add('removing');
        setTimeout(() => toast.remove(), 300);
    }, 2500);
}

// ===== Load Items =====
async function loadItems() {
    try {
        const res = await fetch('/api/inventory/items');
        const data = await res.json();
        if (data.code === 200) { allItems = data.data; renderItems(); loadAlerts(); updateTabCounts(); }
    } catch (e) { showToast('加载物品失败，请稍后重试', 'error'); }
}

// ===== Update Tab Counts =====
function updateTabCounts() {
    const counts = {};
    allItems.forEach(i => {
        const cat = i.category || 'OTHER';
        counts[cat] = (counts[cat] || 0) + 1;
    });
    counts['ALL'] = allItems.length;
    Object.keys(counts).forEach(cat => {
        const el = document.getElementById('count-' + cat);
        if (el) el.textContent = counts[cat];
    });
}

// ===== Load Alerts =====
async function loadAlerts() {
    try {
        const res = await fetch('/api/inventory/alerts');
        const data = await res.json();
        const banner = document.getElementById('alertsBanner');
        if (data.code === 200 && data.data && data.data.length > 0) {
            banner.classList.remove('active');
            void banner.offsetWidth;
            banner.classList.add('active');
            document.getElementById('alertsList').innerHTML = data.data.map(a => {
                let daysInfo = '';
                if (a.daysRemaining != null) {
                    daysInfo = ' <span style="color:#e65100;">(预计可用 ' + a.daysRemaining + ' 天)</span>';
                }
                return '<div class="alert-item">' +
                    '<span class="alert-dot"></span>' +
                    '<strong>' + a.name + '</strong>: ' + a.quantity + ' ' + a.unit + ' 剩余' +
                    daysInfo +
                    ' <a href="/shop">前往商城</a>' +
                    '</div>';
            }).join('');
        } else {
            banner.classList.remove('active');
        }
    } catch (e) { /* silent */ }
}

// ===== Render Items =====
function renderItems() {
    const list = currentFilter === 'ALL'
        ? allItems
        : allItems.filter(i => i.category === currentFilter);
    const container = document.getElementById('itemsList');

    if (list.length === 0) {
        container.innerHTML = '<div class="empty-state">' +
            '<div class="empty-icon">📭</div>' +
            '<p>暂无物品，点击上方"添加物品"开始管理库存吧</p>' +
            '</div>';
        return;
    }

    container.innerHTML = list.map((i, idx) => {
        // Calculate days remaining
        let daysRemaining = null;
        if (i.dailyConsumption > 0) {
            daysRemaining = Math.floor(i.quantity / i.dailyConsumption);
        }

        // Progress bar: based on days remaining, reference 30 days as "full"
        let pct = 100;
        let barColor = '#43a047'; // green
        let barClass = 'bar-green';
        let barLabel = '充足';
        let isLowStock = false;

        if (i.quantity <= 0) {
            pct = 0;
            barColor = '#e53935';
            barClass = 'bar-red';
            barLabel = '已用完';
            isLowStock = true;
        } else if (i.lowStockThreshold != null && i.quantity <= i.lowStockThreshold) {
            // Below threshold: red
            pct = Math.max(5, (i.quantity / (i.lowStockThreshold * 2)) * 100);
            if (pct > 30) pct = 30;
            barColor = '#e53935';
            barClass = 'bar-red';
            barLabel = '库存不足';
            isLowStock = true;
        } else if (daysRemaining !== null) {
            // Has daily consumption data
            if (daysRemaining >= 30) {
                pct = 100;
                barColor = '#43a047';
                barClass = 'bar-green';
                barLabel = '充足';
            } else if (daysRemaining >= 9) {
                pct = 30 + (daysRemaining - 9) / (30 - 9) * 70;
                barColor = '#43a047';
                barClass = 'bar-green';
                barLabel = '预计可用 ' + daysRemaining + ' 天';
            } else if (daysRemaining >= 3) {
                pct = 10 + (daysRemaining - 3) / (9 - 3) * 20;
                barColor = '#ff9800';
                barClass = 'bar-orange';
                barLabel = '预计可用 ' + daysRemaining + ' 天';
            } else {
                pct = Math.max(3, (daysRemaining / 3) * 10);
                barColor = '#e53935';
                barClass = 'bar-red';
                barLabel = '预计可用 ' + daysRemaining + ' 天';
                isLowStock = true;
            }
        }

        const catClass = 'cat-' + (i.category || 'OTHER');
        const badgeClass = 'badge-' + (i.category || 'OTHER');
        const lowStockClass = isLowStock ? ' low-stock' : '';
        const shimmerClass = isLowStock ? ' shimmer' : '';
        const animDelay = (idx * 0.04) + 's';

        let metaHtml = '';
        if (i.notes) {
            metaHtml += '<div class="item-meta">📌 ' + i.notes + '</div>';
        }
        if (i.openDate) {
            metaHtml += '<div class="item-meta">📅 开封日期: ' + i.openDate + '</div>';
        }
        if (i.dailyConsumption > 0) {
            metaHtml += '<div class="item-meta">每日用量: ' + i.dailyConsumption + ' ' + (i.unit || '') + '</div>';
        }

        return '<div class="item-card' + catClass + lowStockClass + '" style="animation-delay:' + animDelay + ';" data-id="' + i.id + '">' +
            '<div class="item-info">' +
                '<div class="item-name-row">' +
                    '<span class="item-name">' + i.name + '</span>' +
                    '<span class="category-badge ' + badgeClass + '">' + (catLabels[i.category] || i.category) + '</span>' +
                    '<span class="low-stock-icon">⚠️</span>' +
                '</div>' +
                metaHtml +
            '</div>' +
            '<div class="item-status">' +
                '<div class="quantity-display">' +
                    i.quantity + '<span class="unit-text"> ' + (i.unit || '') + '</span>' +
                '</div>' +
                '<div class="progress-wrap">' +
                    '<div class="progress-bar">' +
                        '<div class="progress-fill ' + barClass + shimmerClass + '" style="width:' + pct + '%;"></div>' +
                    '</div>' +
                    '<div class="progress-label">' + barLabel + '</div>' +
                '</div>' +
                '<div class="item-actions">' +
                    '<button class="btn-sm btn-consume" onclick="openConsume(' + i.id + ',\'' + i.name.replace(/'/g, "\\'") + '\')">📉 记录消耗</button>' +
                    '<button class="btn-sm btn-edit" onclick="editItem(' + i.id + ')">✏️ 编辑</button>' +
                    '<button class="btn-sm btn-delete" onclick="deleteItem(' + i.id + ')">🗑️ 删除</button>' +
                '</div>' +
            '</div>' +
        '</div>';
    }).join('');
}

// ===== Filter =====
function filterItems(cat) {
    currentFilter = cat;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');
    renderItems();
}

// ===== Add / Edit Modal =====
function openAddModal() {
    document.getElementById('modalTitle').textContent = '➕ 添加物品';
    document.getElementById('editItemId').value = '';
    document.getElementById('itemName').value = '';
    document.getElementById('itemCategory').value = 'PET_FOOD';
    document.getElementById('itemQuantity').value = '';
    document.getElementById('itemUnit').value = '公斤';
    document.getElementById('itemOpenDate').value = '';
    document.getElementById('itemDailyConsumption').value = '';
    document.getElementById('itemThreshold').value = '';
    document.getElementById('itemNotes').value = '';
    document.getElementById('itemModal').classList.add('active');
}

async function editItem(id) {
    const item = allItems.find(i => i.id === id);
    if (!item) return;
    document.getElementById('modalTitle').textContent = '✏️ 编辑物品';
    document.getElementById('editItemId').value = item.id;
    document.getElementById('itemName').value = item.name || '';
    document.getElementById('itemCategory').value = item.category || 'OTHER';
    document.getElementById('itemQuantity').value = item.quantity || '';
    document.getElementById('itemUnit').value = item.unit || '个';
    document.getElementById('itemOpenDate').value = item.openDate || '';
    document.getElementById('itemDailyConsumption').value = item.dailyConsumption || '';
    document.getElementById('itemThreshold').value = item.lowStockThreshold || '';
    document.getElementById('itemNotes').value = item.notes || '';
    document.getElementById('itemModal').classList.add('active');
}

function closeModal() {
    document.getElementById('itemModal').classList.remove('active');
}

async function saveItem() {
    const id = document.getElementById('editItemId').value;
    const name = document.getElementById('itemName').value.trim();
    if (!name) { showToast('请输入物品名称', 'error'); return; }
    const quantity = parseFloat(document.getElementById('itemQuantity').value);
    if (isNaN(quantity) || quantity < 0) { showToast('请输入有效的数量', 'error'); return; }

    const body = {
        name: name,
        category: document.getElementById('itemCategory').value,
        quantity: quantity,
        unit: document.getElementById('itemUnit').value,
        openDate: document.getElementById('itemOpenDate').value || null,
        dailyConsumption: document.getElementById('itemDailyConsumption').value
            ? parseFloat(document.getElementById('itemDailyConsumption').value) : null,
        lowStockThreshold: document.getElementById('itemThreshold').value
            ? parseFloat(document.getElementById('itemThreshold').value) : null,
        notes: document.getElementById('itemNotes').value || null
    };

    try {
        const url = id ? '/api/inventory/items/' + id : '/api/inventory/items';
        const method = id ? 'PUT' : 'POST';
        const res = await fetch(url, {
            method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const data = await res.json();
        if (data.code === 200) {
            closeModal();
            loadItems();
            showToast(id ? '物品已更新' : '物品已添加', 'success');
        } else {
            showToast(data.message || '操作失败', 'error');
        }
    } catch (e) {
        showToast('网络错误，请稍后重试', 'error');
    }
}

// ===== Delete =====
async function deleteItem(id) {
    if (!confirm('确定删除此物品？')) return;
    // Trigger slide-out animation before removing
    const card = document.querySelector('.item-card[data-id="' + id + '"]');
    if (card) {
        card.classList.add('removing');
        await new Promise(resolve => setTimeout(resolve, 350));
    }
    try {
        const res = await fetch('/api/inventory/items/' + id, { method: 'DELETE' });
        if (res.ok) {
            showToast('物品已删除', 'success');
            loadItems();
        } else {
            showToast('删除失败', 'error');
            if (card) card.classList.remove('removing');
        }
    } catch (e) {
        showToast('网络错误，请稍后重试', 'error');
        if (card) card.classList.remove('removing');
    }
}

// ===== Consume =====
function openConsume(id, name) {
    consumeItemId = id;
    document.getElementById('consumeItemName').textContent = name;
    document.getElementById('consumeAmount').value = '';
    document.getElementById('consumeModal').classList.add('active');
}

function closeConsumeModal() {
    document.getElementById('consumeModal').classList.remove('active');
}

async function confirmConsume() {
    const amount = parseFloat(document.getElementById('consumeAmount').value);
    if (!amount || amount <= 0) { showToast('请输入有效的用量', 'error'); return; }
    try {
        const res = await fetch('/api/inventory/items/' + consumeItemId + '/consume', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ amount })
        });
        if (res.ok) {
            closeConsumeModal();
            loadItems();
            showToast('消耗已记录', 'success');
        } else {
            showToast('记录消耗失败', 'error');
        }
    } catch (e) {
        showToast('网络错误，请稍后重试', 'error');
    }
}

// ===== Logout =====
async function logout() {
    await fetch('/api/auth/logout', { method: 'POST' });
    location.href = '/login';
}

// ===== Click outside modal to close =====
document.getElementById('itemModal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});
document.getElementById('consumeModal').addEventListener('click', function(e) {
    if (e.target === this) closeConsumeModal();
});

// ===== Keyboard ESC to close modal =====
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        closeModal();
        closeConsumeModal();
    }
});

// ===== Init =====
loadItems();
</script>
<script src="/js/push.js"></script>
<script src="/js/guard.js"></script>
<script src="/js/common.js"></script>
</body>
</html>
