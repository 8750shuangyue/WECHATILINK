<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sekai PetPlant - 知识库管理</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐾%3C/text%3E%3C/svg%3E">
    <style>
        :root {
            --green-50:#f2f9f4; --green-100:#dff0e6; --green-500:#2f9e63;
            --green-600:#1e8a50; --green-700:#126a3c; --teal:#2a9d8f;
            --ink:#1c2b22; --ink-2:#5b6f63; --line:rgba(28,60,44,.1);
            --grad:linear-gradient(135deg,#2f9e63,#1e8a50 55%,#2a9d8f);
            --shadow:0 10px 30px rgba(20,60,40,.1);
            --radius:18px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Inter","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
            color: var(--ink); min-height: 100vh;
            background:
                radial-gradient(1000px 520px at 85% -10%, rgba(42,157,143,.14), transparent 60%),
                radial-gradient(900px 480px at -10% 110%, rgba(47,158,99,.12), transparent 55%),
                linear-gradient(165deg,#f7fbf8,#eef6f1);
            background-attachment: fixed;
            -webkit-font-smoothing: antialiased;
        }
        ::selection { background: rgba(47,158,99,.22); }
        .topbar {
            position: sticky; top: 0; z-index: 50;
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 28px; color: #fff;
            background: linear-gradient(120deg,#10351f,#1b4a2f 55%,#1e5a3a);
            box-shadow: 0 8px 26px rgba(10,40,22,.28);
        }
        .topbar-brand { font-weight: 800; letter-spacing: .4px; }
        .topbar-right { display: flex; align-items: center; gap: 14px; font-size: 13px; }
        .topbar a { color: #fff; text-decoration: none; opacity: .9; }
        .topbar a:hover { opacity: 1; }
        main { max-width: 980px; margin: 32px auto 60px; padding: 0 20px; }
        .page-title { font-size: 28px; font-weight: 800; color: var(--green-700); }
        .page-sub { color: var(--ink-2); margin: 6px 0 24px; }

        .panel { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px; margin-bottom: 22px; }
        .panel h3 { font-size: 17px; font-weight: 700; color: var(--green-700); margin-bottom: 14px; }
        .upload-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        input[type=file] {
            flex: 1; min-width: 240px; border: 1.5px dashed rgba(47,158,99,.4);
            border-radius: 12px; padding: 12px; background: var(--green-50); cursor: pointer;
        }
        .primary {
            border: 0; border-radius: 11px; padding: 12px 22px;
            font-size: 14px; font-weight: 700; color: #fff; cursor: pointer;
            background: var(--grad); box-shadow: 0 8px 18px rgba(30,138,80,.26); transition: .2s;
        }
        .primary:hover { transform: translateY(-1px); box-shadow: 0 12px 24px rgba(30,138,80,.34); }
        .primary:disabled { opacity: .55; cursor: not-allowed; }
        .hint { font-size: 13px; color: var(--ink-2); margin-top: 10px; }

        .doc-list { display: flex; flex-direction: column; gap: 12px; }
        .doc-card {
            background: #fff; border: 1px solid var(--line); border-radius: 14px;
            padding: 16px 18px; box-shadow: 0 2px 10px rgba(20,60,40,.06);
            display: flex; justify-content: space-between; align-items: center; gap: 14px; transition: .25s;
        }
        .doc-card:hover { transform: translateY(-2px); border-color: rgba(47,158,99,.35); }
        .doc-name { font-weight: 700; color: var(--ink); }
        .doc-meta { font-size: 13px; color: var(--ink-2); margin-top: 4px; }
        .doc-sample { font-size: 13px; color: var(--ink-2); margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .minor {
            border: 1px solid var(--green-100); background: var(--green-50); color: var(--green-700);
            border-radius: 11px; padding: 9px 16px; font-size: 13px; font-weight: 700; cursor: pointer; transition: .2s;
        }
        .minor:hover { background: var(--green-100); }
        .empty { color: var(--ink-2); text-align: center; padding: 32px 0; }
        @media (max-width: 860px) {
            .topbar { padding: 12px 16px; }
            .doc-card { flex-direction: column; align-items: flex-start; }
        }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
</head>
<body>
<header class="topbar">
    <div class="topbar-brand">📚 知识库管理</div>
    <div class="topbar-right">
        <span id="greeting"></span>
        <a href="/home">返回首页</a>
        <a href="javascript:logout()">退出</a>
    </div>
</header>

<main>
    <h1 class="page-title">知识库管理</h1>
    <p class="page-sub">上传文档（PDF / Word / TXT），AI 会自动分块并向量化，对话时作为私有知识被检索。</p>

    <section class="panel">
        <h3>上传文档</h3>
        <div class="upload-row">
            <input type="file" id="kbFile" accept=".pdf,.docx,.txt,.md">
            <button class="primary" id="uploadBtn" onclick="uploadDoc()">上传并入库</button>
        </div>
        <div class="hint" id="uploadHint">支持 PDF、Word、TXT、Markdown，单个不超过 10MB。</div>
    </section>

    <section class="panel">
        <h3>已有文档（<span id="docCount">0</span>）</h3>
        <div id="docList" class="doc-list"><div class="empty">加载中…</div></div>
    </section>
</main>

<script>
var currentUser = '';

requireLogin(function (data) {
    currentUser = data.userName;
    document.getElementById('greeting').textContent = '你好，' + data.userName;
    loadDocs();
});

function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
}

async function loadDocs() {
    try {
        var res = await apiFetch('/api/kb/list');
        var x = await res.json();
        var docs = x.data || [];
        document.getElementById('docCount').textContent = docs.length;
        var box = document.getElementById('docList');
        if (!docs.length) {
            box.innerHTML = '<div class="empty">还没有文档，先上传一个吧。</div>';
            return;
        }
        box.innerHTML = docs.map(function (d) {
            var ts = String(d.timestamp || '').replace('T', ' ').replace('.0', '');
            var name = (d.sourceId || '').replace(/^kb_\d+_/, '');
            var sample = String(d.sample || '').slice(0, 120);
            return '<div class="doc-card">' +
                '<div><div class="doc-name">📄 ' + esc(name) + '</div>' +
                '<div class="doc-meta">' + d.count + ' 个片段 · 入库时间 ' + esc(ts) + '</div>' +
                '<div class="doc-sample">' + esc(sample) + '…</div></div>' +
                '<div><button class="minor" onclick="deleteDoc(\'' + esc(d.sourceId) + '\')">删除</button></div></div>';
        }).join('');
    } catch (e) {
        document.getElementById('docList').innerHTML = '<div class="empty">加载失败</div>';
    }
}

async function uploadDoc() {
    var file = document.getElementById('kbFile').files[0];
    if (!file) return showToast('请先选择文件');
    var btn = document.getElementById('uploadBtn');
    btn.disabled = true;
    document.getElementById('uploadHint').textContent = '正在解析并向量化…';
    try {
        var form = new FormData();
        form.append('file', file);
        var res = await fetch('/api/kb/upload', { method: 'POST', body: form });
        var x = await res.json();
        if (x.success) {
            showToast('入库成功：' + x.count + ' 个片段');
            document.getElementById('uploadHint').textContent = '支持 PDF、Word、TXT、Markdown，单个不超过 10MB。';
            document.getElementById('kbFile').value = '';
            loadDocs();
        } else {
            showToast('入库失败：' + (x.error || '未知错误'));
            document.getElementById('uploadHint').textContent = x.error || '';
        }
    } catch (e) {
        showToast('上传失败：' + e.message);
        document.getElementById('uploadHint').textContent = '上传失败，请重试';
    } finally {
        btn.disabled = false;
    }
}

async function deleteDoc(sourceId) {
    if (!confirm('确定删除该文档及其向量吗？')) return;
    try {
        var res = await apiFetch('/api/kb/' + encodeURIComponent(sourceId), { method: 'DELETE' });
        var x = await res.json();
        if (x.success) { showToast('已删除'); loadDocs(); }
        else showToast(x.error || '删除失败');
    } catch (e) {
        showToast('删除失败：' + e.message);
    }
}
</script>
<script src="/js/guard.js"></script>
<script src="/js/common.js"></script>
</body>
</html>
