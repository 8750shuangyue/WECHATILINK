<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sekai PetPlant - 知识库管理</title>
    <link rel="stylesheet" href="/css/ui.css?v=20261107a">
    <link rel="stylesheet" href="/css/pages.css?v=20261107a">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐾%3C/text%3E%3C/svg%3E">
</head>
<body class="ui-app page-kb">
<script src="/js/shell.js?v=20261107a"></script>

<main class="ui-main">
    <div class="ui-wrap">
        <header class="ui-page-head">
            <div>
                <p class="ui-eyebrow">知识</p>
                <h1>知识库</h1>
                <p class="ui-sub">上传文档（PDF / Word / TXT），AI 会自动分块并向量化，对话时作为私有知识被检索。</p>
            </div>
        </header>

        <section class="ui-card ui-card--pad" style="margin-bottom:16px">
            <h3 class="ui-section-title" style="margin-bottom:14px">上传文档</h3>
            <div class="kb-upload-row">
                <input type="file" id="kbFile" accept=".pdf,.docx,.txt,.md">
                <button class="ui-btn ui-btn-primary" id="uploadBtn" onclick="uploadDoc()">上传并入库</button>
            </div>
            <p class="ui-section-sub" id="uploadHint" style="margin-top:10px">支持 PDF、Word、TXT、Markdown，单个不超过 10MB。</p>
        </section>

        <section class="ui-card ui-card--pad">
            <div class="ui-card-head">
                <h3 class="ui-section-title">已有文档（<span id="docCount">0</span>）</h3>
            </div>
            <div id="docList" class="doc-list"><div class="ui-empty">加载中…</div></div>
        </section>
    </div>
</main>

<script src="/js/guard.js?v=20261107a"></script>
<script src="/js/common.js?v=20261107a"></script>
<script>
var currentUser = '';

requireLogin(function (data) {
    currentUser = data.userName;
    if (window.setShellUser) window.setShellUser(data.userName);
    loadDocs();
});

function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
}

async function loadDocs() {
    try {
        var res = await apiFetch('/api/kb/list');
        var x = await res.json();
        var docs = x.data || [];
        document.getElementById('docCount').textContent = docs.length;
        var box = document.getElementById('docList');
        if (!docs.length) {
            box.innerHTML = '<div class="ui-empty">还没有文档，先上传一个吧。</div>';
            return;
        }
        box.innerHTML = docs.map(function (d) {
            var ts = String(d.timestamp || '').replace('T', ' ').replace('.0', '');
            var name = d.fileName || (d.sourceId || '').replace(/^kb_\d+_/, '');
            var sample = String(d.sample || '').slice(0, 120);
            return '<div class="doc-card">' +
                '<div><div class="doc-name">' + esc(name) + '</div>' +
                '<div class="doc-meta">' + d.count + ' 个片段 · 入库时间 ' + esc(ts) + '</div>' +
                '<div class="doc-sample">' + esc(sample) + '…</div></div>' +
                '<div><button class="ui-btn ui-btn-sm ui-btn-danger" onclick="deleteDoc(\'' + esc(d.sourceId) + '\')">删除</button></div></div>';
        }).join('');
    } catch (e) {
        document.getElementById('docList').innerHTML = '<div class="ui-empty">加载失败</div>';
    }
}

async function uploadDoc() {
    var file = document.getElementById('kbFile').files[0];
    if (!file) return showToast('请先选择文件');
    var btn = document.getElementById('uploadBtn');
    btn.disabled = true;
    document.getElementById('uploadHint').textContent = '正在解析并向量化…';
    try {
        var form = new FormData();
        form.append('file', file);
        var res = await fetch('/api/kb/upload', { method: 'POST', body: form });
        var x = await res.json();
        if (x.success) {
            showToast('入库成功：' + ((x.data && x.data.count) || 0) + ' 个片段');
            document.getElementById('uploadHint').textContent = '支持 PDF、Word、TXT、Markdown，单个不超过 10MB。';
            document.getElementById('kbFile').value = '';
            loadDocs();
        } else {
            showToast('入库失败：' + (x.message || '未知错误'));
            document.getElementById('uploadHint').textContent = x.message || '';
        }
    } catch (e) {
        showToast('上传失败：' + e.message);
        document.getElementById('uploadHint').textContent = '上传失败，请重试';
    } finally {
        btn.disabled = false;
    }
}

async function deleteDoc(sourceId) {
    if (!confirm('确定删除该文档及其向量吗？')) return;
    try {
        var res = await apiFetch('/api/kb/' + encodeURIComponent(sourceId), { method: 'DELETE' });
        var x = await res.json();
        if (x.success) { showToast('已删除'); loadDocs(); }
        else showToast(x.message || '删除失败');
    } catch (e) {
        showToast('删除失败：' + e.message);
    }
}
</script>
</body>
</html>
