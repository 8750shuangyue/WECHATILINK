<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sekai PetPlant - 数据概览</title>
    <link rel="stylesheet" href="/css/ui.css?v=20261110a">
    <link rel="stylesheet" href="/css/pages.css?v=20261110a">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📊%3C/text%3E%3C/svg%3E">
</head>
<body class="ui-app page-stats">
<script src="/js/shell.js?v=20261110a"></script>

<main class="ui-main">
    <div class="ui-wrap">
        <header class="ui-page-head">
            <div>
                <p class="ui-eyebrow">数据</p>
                <h1>数据概览</h1>
                <p class="ui-sub">平台运行数据 · 工具调用观测 · 近 7 天对话趋势</p>
            </div>
        </header>

        <section class="ui-kpis ui-kpis--4" id="statCards" style="margin-bottom:16px">
            <div class="ui-empty">加载中…</div>
        </section>

        <section class="ui-card ui-card--pad" style="margin-bottom:16px">
            <h3 class="ui-section-title" style="margin-bottom:16px">工具调用排行 Top 10</h3>
            <div id="toolRanking"><div class="ui-empty">加载中…</div></div>
        </section>

        <section class="ui-card ui-card--pad">
            <h3 class="ui-section-title" style="margin-bottom:16px">近 7 天对话量</h3>
            <div id="trendChart"><div class="ui-empty">加载中…</div></div>
        </section>
    </div>
</main>

<script src="/js/guard.js?v=20261110a"></script>
<script src="/js/common.js?v=20261110a"></script>
<script>
    var OVERVIEW_META = [
        { key: 'users', label: '注册用户' },
        { key: 'messages', label: '对话消息' },
        { key: 'toolCalls', label: '工具调用' },
        { key: 'kbDocuments', label: '知识库条目' },
        { key: 'careTargets', label: '护理对象' },
        { key: 'pendingReminders', label: '待办提醒' },
        { key: 'posts', label: '社区帖子' },
        { key: 'products', label: '商城商品' }
    ];

    function renderCards(overview) {
        var html = OVERVIEW_META.map(function (m) {
            return '<div class="ui-kpi">' +
                '<span class="ui-kpi-label">' + m.label + '</span>' +
                '<strong>' + (overview[m.key] != null ? overview[m.key] : '-') + '</strong>' +
                '</div>';
        }).join('');
        document.getElementById('statCards').innerHTML = html;
    }

    var esc = UI.escapeHtml;

    function renderRanking(rows) {
        var el = document.getElementById('toolRanking');
        if (!rows || rows.length === 0) {
            el.innerHTML = '<div class="rank-empty">还没有工具调用记录——去聊天页让 AI 调用几个工具试试吧。</div>';
            return;
        }
        var max = Math.max.apply(null, rows.map(function (r) { return r.total; }));
        el.innerHTML = rows.map(function (r) {
            var pct = Math.round(r.total / max * 100);
            var successRate = Math.round(r.successCount / r.total * 100);
            return '<div class="rank-item">' +
                '<div class="rank-name" title="' + esc(r.toolName) + '">' + esc(r.toolName) + '</div>' +
                '<div class="rank-bar-wrap"><div class="rank-bar" style="width:' + pct + '%"></div></div>' +
                '<div class="rank-meta">' + r.total + ' 次 · 成功率 ' + successRate + '% · 均耗 ' + r.avgMs + 'ms</div>' +
                '</div>';
        }).join('');
    }

    function renderTrend(rows) {
        var el = document.getElementById('trendChart');
        if (!rows || rows.length === 0) { el.innerHTML = '<div class="rank-empty">暂无数据</div>'; return; }
        var max = Math.max.apply(null, rows.map(function (r) { return r.count; })) || 1;
        var html = '<div class="trend-wrap">' + rows.map(function (r) {
            var h = Math.max(3, Math.round(r.count / max * 150));
            return '<div class="trend-col">' +
                '<div class="trend-val">' + r.count + '</div>' +
                '<div class="trend-bar" style="height:' + h + 'px"></div>' +
                '<div class="trend-date">' + esc(String(r.date || '').slice(5)) + '</div>' +
                '</div>';
        }).join('') + '</div>';
        el.innerHTML = html;
    }

    requireLogin(function () {
        Promise.all([
            UI.apiJson('/api/stats/overview'),
            UI.apiJson('/api/stats/tool-ranking'),
            UI.apiJson('/api/stats/trend')
        ]).then(function (results) {
            renderCards((results[0] && results[0].data) || {});
            renderRanking((results[1] && results[1].data) || []);
            renderTrend((results[2] && results[2].data) || []);
        }).catch(function (e) {
            document.getElementById('statCards').innerHTML =
                '<div class="ui-empty">加载失败：' + esc(e.message) + '</div>';
        });
    });
</script>
</body>
</html>
