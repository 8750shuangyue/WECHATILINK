<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>发布商品 - PetPlant</title>
    <link rel="stylesheet" href="/css/shop.css">
</head>
<body>
<header>
    <h2>📝 发布商品</h2>
    <div class="tabs">
        <button onclick="location.href='/care'">植物护理</button>
        <button onclick="location.href='/care?type=PET'">宠物护理</button>
        <button onclick="location.href='/shop'" class="active">电商平台</button>
    </div>
    <div class="nav"><span id="userName"></span><button onclick="location.href='/home'">切换系统</button><button onclick="logout()">退出</button></div>
</header>
<main>
    <div class="panel" style="max-width:700px;margin:0 auto;">
        <h3>填写商品信息</h3>
        <form id="publishForm">
            <div class="form-item">
                <label>商品名称 <span class="required">*</span></label>
                <input type="text" id="name" placeholder="请输入商品名称" required>
            </div>
            <div class="form-item">
                <label>商品描述 <span class="required">*</span></label>
                <textarea id="description" rows="3" placeholder="请输入商品描述" required></textarea>
            </div>
            <div class="form-row">
                <div class="form-item">
                    <label>商品价格 <span class="required">*</span></label>
                    <input type="number" step="0.01" id="price" placeholder="0.00" min="0" required>
                </div>
                <div class="form-item">
                    <label>库存数量 <span class="required">*</span></label>
                    <input type="number" id="stock" placeholder="0" min="0" required>
                </div>
            </div>
            <div class="form-item">
                <label>商品分类 <span class="required">*</span></label>
                <select id="categorySelect">
                    <option value="">选择分类...</option>
                </select>
                <div id="selectedCategories" class="category-tags"></div>
            </div>
            <div class="form-item">
                <label>商品图片（多个用逗号分隔）</label>
                <input type="text" id="images" placeholder="图片URL1,图片URL2">
            </div>
            <div class="form-item">
                <label>详情图片（多个用逗号分隔）</label>
                <input type="text" id="detail" placeholder="详情图片URL1,详情图片URL2">
            </div>
            <div class="form-row" style="justify-content:flex-end;">
                <button type="button" class="minor" onclick="location.href='/shop'">取消</button>
                <button type="submit" class="primary">发布商品</button>
            </div>
        </form>
    </div>
</main>
<div id="toast"></div>
<script>
let selectedCategories = [];

fetch('/api/auth/me').then(r => r.json()).then(x => {
    if(x.code!==200)location.href='/login';
    else userName.textContent=x.data.userName;
});

function toast(s){
    const e=document.getElementById('toast');
    e.textContent=s;e.style.display='block';
    setTimeout(()=>e.style.display='none',2600);
}

async function loadCategories(){
    try{
        const r=await fetch('/api/shop/category/list');
        const x=await r.json();
        const cats=x.data;
        const select=document.getElementById('categorySelect');
        select.innerHTML='<option value="">选择分类...</option>';
        const parents=cats.filter(c=>!c.parentCategoryId||c.parentCategoryId===0);
        const children=cats.filter(c=>c.parentCategoryId&&c.parentCategoryId>0);
        parents.forEach(p=>{
            const opt=document.createElement('option');
            opt.value=p.id;
            opt.textContent=p.name;
            select.appendChild(opt);
            children.filter(c=>c.parentCategoryId===p.id).forEach(ch=>{
                const sub=document.createElement('option');
                sub.value=ch.id;
                sub.textContent='  └ '+ch.name;
                select.appendChild(sub);
            });
        });
    }catch(e){console.error(e)}
}

function renderCategoryTags(){
    const container=document.getElementById('selectedCategories');
    container.innerHTML=selectedCategories.map(c=>
        `<span class="category-tag">${c.name}<span class="remove" onclick="removeCategory(${c.id})">×</span></span>`
    ).join('');
}

function removeCategory(id){
    selectedCategories=selectedCategories.filter(c=>c.id!==id);
    renderCategoryTags();
}

document.getElementById('categorySelect').addEventListener('change',function(){
    const id=Number(this.value);
    if(!id)return;
    const opt=this.options[this.selectedIndex];
    if(!selectedCategories.some(c=>c.id===id)){
        selectedCategories.push({id,name:opt.textContent.trim()});
        renderCategoryTags();
    }
    this.value='';
});

document.getElementById('publishForm').addEventListener('submit',async function(e){
    e.preventDefault();
    const name=document.getElementById('name').value.trim();
    const desc=document.getElementById('description').value.trim();
    const price=document.getElementById('price').value.trim();
    const stock=document.getElementById('stock').value.trim();
    const images=document.getElementById('images').value.trim();
    const detail=document.getElementById('detail').value.trim();

    if(!name){return toast('请输入商品名称')}
    if(!desc){return toast('请输入商品描述')}
    if(!price||isNaN(Number(price))){return toast('请输入有效价格')}
    if(!stock||isNaN(Number(stock))){return toast('请输入有效库存')}
    if(selectedCategories.length===0){return toast('请选择分类')}

    const data={
        name,description:desc,
        price:Number(price),stock:Number(stock),
        categoryIds:'['+selectedCategories.map(c=>c.id).join(',')+']',
        images:images?JSON.stringify(images.split(',').map(s=>s.trim()).filter(Boolean)):'[]',
        detail:detail?JSON.stringify(detail.split(',').map(s=>s.trim()).filter(Boolean)):'[]',
        status:'ON'
    };

    try{
        const r=await fetch('/api/shop/publish',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify(data)
        });
        const x=await r.json();
        if(x.code===200){
            toast('商品发布成功！');
            setTimeout(()=>location.href='/shop',1200);
        }else{
            toast('发布失败：'+(x.message||'未知错误'));
        }
    }catch(e){toast('网络异常')}
});

async function logout(){await fetch('/api/auth/logout',{method:'POST'});location.href='/login'}

loadCategories();
</script>
</body>
</html>
