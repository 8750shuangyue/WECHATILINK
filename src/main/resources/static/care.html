<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>植物与宠物 AI 护理助手</title>
    <link rel="stylesheet" href="/css/ui.css?v=20261107a">
    <link rel="stylesheet" href="/css/pages.css?v=20261107a">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐾%3C/text%3E%3C/svg%3E">
</head>
<body class="ui-app page-care">
<script src="/js/shell.js?v=20261107a"></script>

<main class="ui-main">
    <div class="ui-wrap">
        <header class="ui-page-head">
            <div>
                <p class="ui-eyebrow">护理</p>
                <h1>护理助手</h1>
                <p class="ui-sub">识别状态、管理档案、记录每一次浇水与喂养。</p>
            </div>
            <div class="ui-head-actions">
                <div class="ui-seg" role="tablist" aria-label="护理对象">
                    <button id="plantTab" class="active" role="tab" onclick="switchType('PLANT')">植物护理</button>
                    <button id="petTab" role="tab" onclick="switchType('PET')">宠物护理</button>
                </div>
            </div>
        </header>

        <section class="care-hero">
            <div>
                <h1 id="heroTitle">让每一株植物都被科学照顾</h1>
                <p id="heroDesc">上传照片进行 AI 识别和状态诊断，建立专属档案，持续记录浇水、施肥与生长情况。助手会结合真实护理历史回答问题。</p>
            </div>
            <label class="care-upload" id="uploadBox">
                <input id="imageFile" type="file" accept="image/*" onchange="recognize(this.files[0])">
                <span class="care-upload-emoji">📷</span>
                <strong id="uploadText">上传植物照片</strong>
                <span class="muted">支持 JPG、PNG，识别后可保存档案</span>
            </label>
        </section>

        <div class="care-grid">
            <section class="ui-card ui-card--pad">
                <h3 class="ui-section-title" style="margin-bottom:12px">AI 识别与诊断</h3>
                <div id="emptyResult" class="muted">请先上传照片，识别结果会显示在这里。</div>
                <div id="aiResult" style="display:none">
                    <div class="care-result" id="resultText"></div>
                    <h4 class="ui-section-title" style="margin:16px 0 10px">保存为档案</h4>
                    <div class="ui-field"><input id="targetName" placeholder="给它取个名字"></div>
                    <div class="ui-field"><input id="species" placeholder="物种/品种"></div>
                    <div class="ui-field"><input id="breed" placeholder="细分品种（仅宠物）" style="display:none"></div>
                    <button class="ui-btn ui-btn-primary" onclick="saveTarget()">保存档案</button>
                </div>
            </section>

            <section class="ui-card ui-card--pad">
                <h3 class="ui-section-title" style="margin-bottom:8px">专属护理问答</h3>
                <p class="muted" style="margin-bottom:12px">每次提问都会调用 AI 专业助手，结合你的档案和最近护理记录回答。</p>
                <select id="targetSelect" style="margin-bottom:10px" onchange="onTargetChange()">
                    <option value="">选择一个档案（可选）</option>
                </select>
                <div class="care-qa-row">
                    <textarea id="question" rows="3" placeholder="例如：我的绿萝叶子发黄，结合最近浇水记录该怎么办？"></textarea>
                    <button class="ui-btn ui-btn-primary" onclick="askAI()">提问</button>
                </div>
                <div id="qaResult" class="care-result" style="display:none;margin-top:14px"></div>
                <div id="qaSummary" class="care-result" style="display:none;margin-top:14px">
                    <div style="font-weight:600;margin-bottom:8px;color:var(--ui-accent)">护理摘要</div>
                    <div id="summaryText"></div>
                </div>
                <div id="summaryBtnContainer" style="display:none;margin-top:10px;text-align:right">
                    <button class="ui-btn" onclick="generateSummary()">生成护理摘要</button>
                </div>
            </section>
        </div>

        <div class="care-stack">
            <section class="ui-card ui-card--pad">
                <h3 class="ui-section-title" id="archiveTitle" style="margin-bottom:14px">我的植物档案</h3>
                <div id="targets" class="care-targets"></div>
            </section>

            <section class="ui-card ui-card--pad">
                <h3 class="ui-section-title" style="margin-bottom:8px">成长记录</h3>
                <p class="muted" style="margin-bottom:12px">来自所选档案的护理记录，按时间倒序排列。</p>
                <div id="timelineBox" class="muted">选择一个档案后查看成长记录。</div>
            </section>

            <section class="ui-card ui-card--pad">
                <h3 class="ui-section-title" style="margin-bottom:14px">我的素材</h3>
                <div id="assetsBox" class="muted">加载中…</div>
            </section>
        </div>
    </div>
</main>

<script src="/js/guard.js?v=20261107a"></script>
<script src="/js/common.js?v=20261107a"></script>
<script>
let type='PLANT', imageData='', diagnosis='', lastReply='', lastTargetName='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

fetch('/api/auth/me', { cache: 'no-store' }).then(r=>r.json()).then(x=>{
    if(x.code!==200){ location.href='/login'; return; }
    if(window.setShellUser) window.setShellUser(x.data.userName || x.data.user || '');
});
function toast(s){ showToast(s); }

function switchType(t){
    type=t;
    plantTab.classList.toggle('active',t==='PLANT');
    petTab.classList.toggle('active',t==='PET');
    heroTitle.textContent=t==='PLANT'?'让每一株植物都被科学照顾':'让每一只宠物都获得贴心守护';
    heroDesc.textContent=t==='PLANT'?'上传照片进行 AI 识别和状态诊断，建立专属档案，持续记录浇水、施肥与生长情况。':'上传宠物照片识别种类和外观健康状态，建立档案，持续记录喂养、驱虫、疫苗与就医情况。';
    uploadText.textContent='上传'+(t==='PLANT'?'植物':'宠物')+'照片';
    archiveTitle.textContent='我的'+(t==='PLANT'?'植物':'宠物')+'档案';
    breed.style.display=t==='PET'?'block':'none';
    aiResult.style.display='none';
    emptyResult.style.display='block';
    loadTargets();
    loadTimeline(null);
}

function recognize(file){
    if(!file)return;
    uploadBox.classList.add('loading');
    compressImage(file).then(function(b64){
        imageData='data:image/webp;base64,'+b64;
        return fetch('/api/care/identify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,image:b64})})
    }).then(function(r){
        if(!r.ok)throw Error('识别失败');
        return r.json()
    }).then(function(x){
        diagnosis=x.data.result;
        resultText.textContent=diagnosis;
        emptyResult.style.display='none';
        aiResult.style.display='block';
        species.value=extractSpecies(diagnosis)
    }).catch(function(e){toast(e.message)}).finally(function(){uploadBox.classList.remove('loading')})
}

function extractSpecies(s){
    const m=s.match(/(?:品种|物种|名称)[：:]\s*([^\n，。]+)/);
    return m?m[1].replace(/\*\*/g,'').trim():''
}

async function saveTarget(){
    if(!targetName.value.trim())return toast('请填写档案名称');
    const body={name:targetName.value.trim(),species:species.value.trim(),breed:breed.value.trim(),imageUrl:imageData?'data:image/uploaded':''};
    const r=await fetch('/api/care/targets/'+type,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok)return toast('保存失败');
    targetName.value='';
    toast('档案已保存');
    loadTargets()
}

async function loadTargets(){
    const r=await fetch('/api/care/targets/'+type);
    if(r.status===401)return location.href='/login';
    const x=await r.json();
    const rows=x.data;
    targets.innerHTML=rows.length?rows.map(cardHtml).join(''):'<div class="ui-empty">还没有档案，上传照片识别或直接创建一个吧。</div>';
    updateTargetSelect(rows)
}

function cardHtml(x){
    return `<article class="ui-card care-target"><h4>${type==='PLANT'?'🌱':'🐾'} ${esc(x.name)}</h4><div class="muted">${esc(x.species||'未填写品种')}${x.breed?' · '+esc(x.breed):''}</div><div class="care-actions"><button class="ui-btn ui-btn-sm" onclick="showRecords(${x.id},this)">护理记录</button><button class="ui-btn ui-btn-sm" onclick="addRecord(${x.id})">新增记录</button><button class="ui-btn ui-btn-sm ui-btn-danger" onclick="removeTarget(${x.id})">删除</button></div><div class="care-records" id="records-${x.id}" style="display:none"></div></article>`
}

async function showRecords(id,btn){
    const box=document.getElementById('records-'+id);
    if(box.style.display!=='none'){box.style.display='none';return}
    const r=await fetch(`/api/care/records/${type}/${id}`);
    const x=await r.json();
    const rows=x.data;
    box.innerHTML=rows.length?rows.map(x=>`<div class="care-record"><b>${esc(x.recordType||'护理')}</b> · ${esc(x.content||'')}<div class="muted">${esc(x.createdAt||'')}</div></div>`).join(''):'<div class="ui-empty">暂无护理记录</div>';
    box.style.display='block'
}

async function addRecord(id){
    const recordType=prompt(type==='PLANT'?'记录类型：浇水/施肥/修剪/换盆':'记录类型：喂养/洗护/驱虫/疫苗/就医');
    if(!recordType)return;
    const content=prompt('记录详情');
    if(content===null)return;
    await fetch('/api/care/records',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({targetType:type,targetId:id,recordType,content})});
    toast('护理记录已保存');
    const box=document.getElementById('records-'+id);
    box.style.display='none';
    showRecords(id)
}

async function removeTarget(id){
    if(!confirm('确定删除档案及其护理记录？'))return;
    await fetch(`/api/care/targets/${type}/${id}`,{method:'DELETE'});
    loadTargets()
}

function updateTargetSelect(rows){
    const sel=document.getElementById('targetSelect');
    sel.innerHTML='<option value="">选择一个档案（可选）</option>';
    rows.forEach(x=>{const opt=document.createElement('option');opt.value=x.id;opt.textContent=x.name+(x.species?' - '+x.species:'');sel.appendChild(opt)});
    qaSummary.style.display='none';
    summaryBtnContainer.style.display='none'
}

function onTargetChange(){
    qaSummary.style.display='none';
    summaryBtnContainer.style.display='none';
    loadTimeline(document.getElementById('targetSelect').value)
}

async function loadTimeline(targetId){
    const box=document.getElementById('timelineBox');
    if(!targetId){box.innerHTML='<div class="muted">选择一个档案后查看成长记录。</div>';return}
    box.innerHTML='<div class="muted">加载中…</div>';
    try{
        const r=await fetch('/api/care/records/'+type+'/'+targetId);
        if(r.status===401)return location.href='/login';
        const x=await r.json();
        const rows=x.data||[];
        box.innerHTML=rows.length?rows.map(e=>`<div class="care-record"><b>${esc(e.recordType||'护理')}</b>${e.content?' · '+esc(e.content):''}<div class="muted">${esc(e.createdAt||'')}</div></div>`).join(''):'<div class="ui-empty">暂无护理记录</div>'
    }catch(e){box.innerHTML='<div class="muted">成长记录加载失败</div>'}
}

async function loadAssets(){
    const box=document.getElementById('assetsBox');
    try{
        const r=await fetch('/api/gallery/list');
        if(r.status===401)return location.href='/login';
        const x=await r.json();
        const rows=x.data||[];
        if(!rows.length){box.innerHTML='<div class="muted">还没有素材，去对话页让 AI 生成图片或语音吧。</div>';return}
        box.innerHTML='<div class="care-assets">'+rows.map(a=>{
            const url='/uploads/'+encodeURIComponent(a.fileName||'');
            const isImage=String(a.mediaType||'').indexOf('image')===0;
            const media=isImage
                ?'<a href="'+url+'" target="_blank"><img src="'+url+'" loading="lazy" alt=""></a>'
                :'<audio controls src="'+url+'" style="width:200px"></audio>';
            return '<div class="care-asset">'+media+'<div class="muted" style="font-size:12px;word-break:break-all;margin-top:6px">'+esc(a.fileName||'')+'</div></div>'
        }).join('')+'</div>'
    }catch(e){box.innerHTML='<div class="muted">素材加载失败</div>'}
}

async function askAI(){
    const q=question.value.trim();
    if(!q)return toast('请输入护理问题');
    qaResult.style.display='block';
    qaResult.textContent='AI正在分析中…';
    qaSummary.style.display='none';
    summaryBtnContainer.style.display='none';
    const targetSelect=document.getElementById('targetSelect');
    const targetId=targetSelect.value?parseInt(targetSelect.value):null;
    const r=await fetch('/api/care/qa',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,targetType:type,targetId:targetId,includeCitations:true})});
    const x=await r.json();
    const _sources=(x.data&&x.data.sources)||[];
    renderAnswerWithCitations(qaResult,x.data.reply||'暂时无法回答',_sources,{idPrefix:'care'});
    renderSourcesBlock(qaResult,_sources,{idPrefix:'care'});
    lastReply=x.data.reply||'';
    lastTargetName=x.data.targetName||'';
    if(lastReply){summaryBtnContainer.style.display='block';qaSummary.style.display='none'}
}

async function generateSummary(){
    if(!lastReply)return toast('请先提问获取护理建议');
    qaSummary.style.display='block';
    summaryText.textContent='AI正在生成摘要…';
    const r=await fetch('/api/care/qa/summary',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reply:lastReply,targetType:type,targetName:lastTargetName})});
    const x=await r.json();
    summaryText.textContent=x.data.summary||'无法生成摘要'
}

loadTargets();
loadAssets();
</script>
</body>
</html>
