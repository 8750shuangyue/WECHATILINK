<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sekai PetPlant - 护理提醒</title>
    <link rel="stylesheet" href="/css/ui.css?v=20261110a">
    <link rel="stylesheet" href="/css/pages.css?v=20261110a">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐾%3C/text%3E%3C/svg%3E">
</head>
<body class="ui-app page-reminders">
<script src="/js/shell.js?v=20261110a"></script>

<main class="ui-main">
    <div class="ui-wrap">
        <header class="ui-page-head">
            <div>
                <p class="ui-eyebrow">提醒</p>
                <h1>护理提醒</h1>
                <p class="ui-sub">设置浇水、施肥、喂药等提醒，到期后通过浏览器推送通知你。</p>
            </div>
            <div class="ui-head-actions">
                <button class="ui-btn" id="briefingBtn" onclick="generateBriefing()">生成今日简报</button>
            </div>
        </header>

        <section class="ui-kpis" style="margin-bottom:16px">
            <div class="ui-kpi">
                <span class="ui-kpi-label">待处理</span>
                <strong id="statPending">0</strong>
            </div>
            <div class="ui-kpi">
                <span class="ui-kpi-label">已发送</span>
                <strong id="statSent">0</strong>
            </div>
            <div class="ui-kpi">
                <span class="ui-kpi-label">已完成</span>
                <strong id="statDone">0</strong>
            </div>
        </section>

        <section class="ui-card ui-card--pad" style="margin-bottom:16px">
            <div class="ui-card-head">
                <div>
                    <h3 class="ui-section-title">今日简报</h3>
                    <p class="ui-section-sub">结合天气、护理待办与养护知识生成今日日报。</p>
                </div>
            </div>
            <div class="briefing-box" id="briefingBox">还没有生成简报。</div>
        </section>

        <div class="reminders-grid">
            <section class="ui-card ui-card--pad">
                <h3 class="ui-section-title" style="margin-bottom:14px">新建提醒</h3>
                <div class="ui-field">
                    <label for="rmType">提醒类型</label>
                    <select id="rmType">
                        <option value="浇水">浇水</option>
                        <option value="施肥">施肥</option>
                        <option value="驱虫">驱虫</option>
                        <option value="疫苗">疫苗</option>
                        <option value="喂药">喂药</option>
                        <option value="其他">其他</option>
                    </select>
                </div>
                <div class="ui-field">
                    <label for="rmContent">提醒内容</label>
                    <textarea id="rmContent" rows="2" placeholder="例如：给绿萝浇水 200ml"></textarea>
                </div>
                <div class="ui-field">
                    <label for="rmTime">计划时间</label>
                    <input type="datetime-local" id="rmTime">
                </div>
                <button class="ui-btn ui-btn-primary" style="width:100%" onclick="createReminder()">创建提醒</button>
            </section>

            <section class="ui-card ui-card--pad">
                <div class="ui-card-head">
                    <h3 class="ui-section-title">提醒列表</h3>
                </div>
                <div id="reminderList" class="reminder-list"><div class="ui-empty">加载中…</div></div>
            </section>
        </div>
    </div>
</main>

<script src="/js/guard.js?v=20261110a"></script>
<script src="/js/common.js?v=20261110a"></script>
<script>
var currentUser = '';

requireLogin(function (data) {
    currentUser = data.userName;
    if (window.setShellUser) window.setShellUser(data.userName);
    loadReminders();
});

async function loadReminders() {
    try {
        var x = await UI.apiJson('/api/ai/care/reminders');
        var rows = (x.data || []).slice(0, 20);
        var pending = rows.filter(function (r) { return r.status === 'PENDING'; }).length;
        var sent = rows.filter(function (r) { return r.status === 'SENT'; }).length;
        var done = rows.filter(function (r) { return r.status === 'DONE'; }).length;
        document.getElementById('statPending').textContent = pending;
        document.getElementById('statSent').textContent = sent;
        document.getElementById('statDone').textContent = done;
        renderList(rows);
    } catch (e) {
        document.getElementById('reminderList').innerHTML = '<div class="ui-empty">加载失败</div>';
    }
}

function renderList(rows) {
    var box = document.getElementById('reminderList');
    if (!rows.length) {
        box.innerHTML = '<div class="ui-empty">还没有提醒，先创建一个吧。</div>';
        return;
    }
    box.innerHTML = rows.map(function (r) {
        var due = String(r.due_at || '').replace('.0', '').replace('T', ' ');
        var status = r.status || 'PENDING';
        var type = r.reminder_type || '提醒';
        var repeat = r.repeat_rule ? ' · 重复:' + r.repeat_rule : '';
        var doneBtn = status === 'DONE'
            ? '<button class="ui-btn ui-btn-sm" disabled>已完成</button>'
            : '<button class="ui-btn ui-btn-sm" onclick="completeReminder(' + r.id + ')">标记完成</button>';
        return '<div class="reminder-card">' +
            '<div><span class="reminder-type">' + esc(type) + '</span>' +
            '<div class="reminder-content">' + esc(r.content || '') + '</div>' +
            '<div class="reminder-meta">计划时间：' + esc(due) + repeat + '</div>' +
            '<div><span class="status-chip status-' + status + '">' +
            ({PENDING:'待处理', SENT:'已发送', DONE:'已完成'}[status] || status) + '</span></div></div>' +
            '<div>' + doneBtn + '</div></div>';
    }).join('');
}

var esc = UI.escapeHtml;

async function createReminder() {
    var content = document.getElementById('rmContent').value.trim();
    var time = document.getElementById('rmTime').value;
    if (!content) return showToast('请填写提醒内容');
    if (!time) return showToast('请选择计划时间');
    try {
        var x = await UI.apiJson('/api/ai/care/reminder', {
            method: 'POST',
            body: {
                title: document.getElementById('rmType').value,
                content: content,
                reminderTime: time
            }
        });
        if (x.success) {
            showToast('提醒已创建');
            document.getElementById('rmContent').value = '';
            document.getElementById('rmTime').value = '';
            loadReminders();
        } else {
            showToast(x.error || '创建失败');
        }
    } catch (e) {
        showToast('创建失败: ' + e.message);
    }
}

async function generateBriefing() {
    var box = document.getElementById('briefingBox');
    var btn = document.getElementById('briefingBtn');
    UI.setBusy(btn, true, { text: '生成中…' });
    box.innerHTML = 'AI 正在生成日报…';
    try {
        var x = await UI.apiJson('/api/briefing/generate', { method: 'POST' });
        if (x.code === 200 && x.data) {
            box.innerHTML = esc(x.data).replace(/\n/g, '<br>');
        } else {
            box.innerHTML = '生成失败：' + esc(x.message || '未知错误');
        }
    } catch (e) {
        box.innerHTML = '生成失败，请稍后重试';
    } finally {
        UI.setBusy(btn, false);
    }
}

async function completeReminder(id) {
    try {
        var x = await UI.apiJson('/api/ai/care/reminder/' + id + '/complete', {
            method: 'POST',
            body: {}
        });
        if (x.success) {
            showToast('已完成');
            loadReminders();
        } else {
            showToast(x.error || '操作失败');
        }
    } catch (e) {
        showToast('操作失败: ' + e.message);
    }
}
</script>
</body>
</html>
