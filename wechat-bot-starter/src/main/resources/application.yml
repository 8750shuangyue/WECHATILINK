spring:
  application:
    name: WechatBotText

server:
  port: 8080

logging:
  level:
    com.example.wechat: INFO
    com.github.wechat.ilink.sdk: DEBUG

chat:
  api:
    base-url: ${CHAT_API_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    key: ${CHAT_API_KEY:}
    model: qwen-plus
    system-prompt: "你是一个简洁友好的微信聊天助手，请根据用户输入进行自然的中文文本回复。"
    temperature: 0.7
  vision:
    model: qwen-vl-max
    max-tokens: 1000
    temperature: 0.7
  image-gen:
    model: wanx-v1
    size: "1024*1024"
    style: "<auto>"
    timeout-seconds: 60
  audio-gen:
    voice: zh-CN-XiaoxiaoNeural
    rate: "+0%"
    volume: "+0%"
    timeout-seconds: 30
    edge-tts-path: "edge-tts"

wechat:
  login:
    auto-start: false
  ilink:
    connect-timeout-ms: 35000
    read-timeout-ms: 35000
    write-timeout-ms: 35000
    http-max-retries: 3
    retry-base-delay-ms: 1000
    retry-max-delay-ms: 10000
    heartbeat-enabled: true
    heartbeat-interval-ms: 30000
    channel-version: "1.0.0"

weather:
  api:
    key: ${WEATHER_API_KEY:}
    base-url: "https://api.seniverse.com/v3/weather/now.json"
