<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">AI 对话与 RAG 数据流</title>
  <desc id="desc">/api/ai/chat/stream 的请求、检索、记忆、生成、SSE 回传、消息落库与异步向量/摘要写入链路。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/>
    </marker>
    <marker id="aReturn" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/>
    </marker>
    <marker id="aGreen" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#16a34a"/>
    </marker>
    <marker id="aRose" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#f43f5e"/>
    </marker>
    <marker id="aViolet" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8b5cf6"/>
    </marker>
    <style>
      text { font-family: 'Microsoft YaHei','Noto Sans SC','PingFang SC',sans-serif; }
      .lbl { font-size: 9.5px; fill: #475569; paint-order: stroke; stroke: #f6f7fb; stroke-width: 4px; stroke-linejoin: round; }
      .lbl-mono { font-family: 'Cascadia Code','Consolas','SFMono-Regular',monospace; font-size: 9px; fill: #475569; paint-order: stroke; stroke: #f6f7fb; stroke-width: 4px; stroke-linejoin: round; }
      .lbl-green { font-size: 9.5px; fill: #15803d; paint-order: stroke; stroke: #f6f7fb; stroke-width: 4px; stroke-linejoin: round; }
      .lbl-rose { font-size: 9.5px; fill: #be123c; paint-order: stroke; stroke: #f6f7fb; stroke-width: 4px; stroke-linejoin: round; }
      .lbl-violet { font-size: 9.5px; fill: #6d28d9; paint-order: stroke; stroke: #f6f7fb; stroke-width: 4px; stroke-linejoin: round; }
      .step { font-size: 8px; font-weight: 700; fill: #ffffff; }
      .p-title { font-size: 10.5px; font-weight: 700; text-anchor: middle; }
      .p-sub { font-size: 8.5px; text-anchor: middle; fill: #64748b; }
    </style>
  </defs>

  <rect width="1500" height="900" fill="#f6f7fb"/>
  <text x="40" y="46" font-size="26" font-weight="700" fill="#0f172a">AI 对话与 RAG 数据流</text>
  <text x="40" y="72" font-size="12.5" fill="#64748b">正式入口 POST /api/ai/chat/stream（SSE）· 护理问答 /api/care/qa 复用同一套「记忆 + RAG」契约</text>
  <text x="1460" y="46" font-size="11.5" fill="#94a3b8" text-anchor="end">① – ⑲ 为执行顺序，⑳ 为异步回写</text>
  <text x="1460" y="66" font-size="11" fill="#94a3b8" text-anchor="end">实线：调用 / 写入　·　虚线：返回 / 异步</text>

  <!-- 参与者 -->
  <g filter="url(#shadow)">
    <rect x="15" y="100" width="150" height="44" rx="10" fill="#eefaf2" stroke="#86efac"/>
    <text x="90" y="117" class="p-title" fill="#166534">Browser</text>
    <text x="90" y="133" class="p-sub">chat.html · SSE</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="195" y="100" width="150" height="44" rx="10" fill="#ecfdf9" stroke="#99f6e4"/>
    <text x="270" y="117" class="p-title" fill="#0f766e">AiController</text>
    <text x="270" y="133" class="p-sub">SseEmitter 120s</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="385" y="100" width="150" height="44" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="460" y="117" class="p-title" fill="#6d28d9">LlmService</text>
    <text x="460" y="133" class="p-sub">HTTP / SSE</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="575" y="100" width="150" height="44" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="650" y="117" class="p-title" fill="#6d28d9" font-size="9.5">RagContextService</text>
    <text x="650" y="133" class="p-sub">检索编排 / 引用</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="765" y="100" width="150" height="44" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="840" y="117" class="p-title" fill="#6d28d9" font-size="9.5">VectorStoreService</text>
    <text x="840" y="133" class="p-sub">SQLite + 内存索引</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="955" y="100" width="150" height="44" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="1030" y="117" class="p-title" fill="#6d28d9" font-size="9.5">ChatMemoryService</text>
    <text x="1030" y="133" class="p-sub">窗口 / 摘要</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1135" y="100" width="150" height="44" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="1210" y="117" class="p-title" fill="#334155">MySQL</text>
    <text x="1210" y="133" class="p-sub">ilink_chat</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1315" y="100" width="150" height="44" rx="10" fill="#fff1f2" stroke="#fecdd3"/>
    <text x="1390" y="117" class="p-title" fill="#be123c">DeepSeek</text>
    <text x="1390" y="133" class="p-sub">V4-Pro</text>
  </g>

  <!-- 生命线 -->
  <g stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 5">
    <line x1="90" y1="144" x2="90" y2="770"/>
    <line x1="270" y1="144" x2="270" y2="770"/>
    <line x1="460" y1="144" x2="460" y2="770"/>
    <line x1="650" y1="144" x2="650" y2="770"/>
    <line x1="840" y1="144" x2="840" y2="770"/>
    <line x1="1030" y1="144" x2="1030" y2="770"/>
    <line x1="1210" y1="144" x2="1210" y2="770"/>
    <line x1="1390" y1="144" x2="1390" y2="770"/>
  </g>

  <!-- 1 Browser -> AiController -->
  <line x1="90" y1="175" x2="266" y2="175" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <circle cx="102" cy="175" r="7" fill="#475569"/><text x="102" y="178" text-anchor="middle" class="step">1</text>
  <text x="112" y="168" class="lbl-mono">POST /api/ai/chat/stream</text>

  <!-- 2 AiController self -->
  <path d="M270,196 C312,196 312,220 274,220" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>
  <circle cx="300" cy="191" r="7" fill="#475569"/><text x="300" y="194" text-anchor="middle" class="step">2</text>
  <text x="320" y="212" class="lbl">创建会话 + SseEmitter(120s)</text>

  <!-- 3 AiController -> LlmService -->
  <line x1="270" y1="242" x2="456" y2="242" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <circle cx="282" cy="242" r="7" fill="#475569"/><text x="282" y="245" text-anchor="middle" class="step">3</text>
  <text x="292" y="235" class="lbl">chatStream(userId, conversationId)</text>

  <!-- 4 LlmService -> RagContext -->
  <line x1="460" y1="275" x2="646" y2="275" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <circle cx="472" cy="275" r="7" fill="#475569"/><text x="472" y="278" text-anchor="middle" class="step">4</text>
  <text x="482" y="268" class="lbl">buildContextWithTrace(query)</text>

  <!-- 5 RagContext -> VectorStore -->
  <line x1="650" y1="305" x2="836" y2="305" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <circle cx="662" cy="305" r="7" fill="#475569"/><text x="662" y="308" text-anchor="middle" class="step">5</text>
  <text x="672" y="298" class="lbl">searchSimilarWithMetadataAndTrace()</text>

  <!-- 6 VectorStore self -->
  <path d="M840,326 C882,326 882,350 844,350" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>
  <circle cx="870" cy="321" r="7" fill="#475569"/><text x="870" y="324" text-anchor="middle" class="step">6</text>
  <text x="890" y="342" class="lbl">阈值 0.45 · 重排 · 压缩</text>

  <!-- 7 VectorStore -> RagContext (return) -->
  <line x1="840" y1="365" x2="654" y2="365" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#aReturn)"/>
  <circle cx="828" cy="365" r="7" fill="#94a3b8"/><text x="828" y="368" text-anchor="middle" class="step">7</text>
  <text x="818" y="358" class="lbl" text-anchor="end">results + RetrievalTraceStats</text>

  <!-- 8 RagContext -> LlmService (return) -->
  <line x1="650" y1="395" x2="464" y2="395" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#aReturn)"/>
  <circle cx="638" cy="395" r="7" fill="#94a3b8"/><text x="638" y="398" text-anchor="middle" class="step">8</text>
  <text x="628" y="388" class="lbl" text-anchor="end">context + sources + traceId</text>

  <!-- 9 LlmService -> ChatMemory -->
  <line x1="460" y1="425" x2="1026" y2="425" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <circle cx="472" cy="425" r="7" fill="#475569"/><text x="472" y="428" text-anchor="middle" class="step">9</text>
  <text x="482" y="418" class="lbl">buildPromptMessages(history + summary + RAG)</text>

  <!-- 10 ChatMemory -> MySQL -->
  <line x1="1030" y1="455" x2="1206" y2="455" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <circle cx="1042" cy="455" r="7" fill="#475569"/><text x="1042" y="458" text-anchor="middle" class="step">10</text>
  <text x="1052" y="448" class="lbl">SELECT messages / summaries</text>

  <!-- 11 MySQL -> ChatMemory (return) -->
  <line x1="1210" y1="485" x2="1034" y2="485" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#aReturn)"/>
  <circle cx="1198" cy="485" r="7" fill="#94a3b8"/><text x="1198" y="488" text-anchor="middle" class="step">11</text>
  <text x="1188" y="478" class="lbl" text-anchor="end">history + summary</text>

  <!-- 12 ChatMemory -> LlmService (return) -->
  <line x1="1030" y1="515" x2="464" y2="515" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#aReturn)"/>
  <circle cx="1018" cy="515" r="7" fill="#94a3b8"/><text x="1018" y="518" text-anchor="middle" class="step">12</text>
  <text x="1008" y="508" class="lbl" text-anchor="end">messages[]</text>

  <!-- 13 LlmService -> DeepSeek -->
  <line x1="460" y1="545" x2="1386" y2="545" stroke="#f43f5e" stroke-width="1.6" marker-end="url(#aRose)"/>
  <circle cx="472" cy="545" r="7" fill="#f43f5e"/><text x="472" y="548" text-anchor="middle" class="step">13</text>
  <text x="482" y="538" class="lbl-rose">POST /chat/completions stream=true</text>

  <!-- 14 DeepSeek -> LlmService (return) -->
  <line x1="1390" y1="575" x2="464" y2="575" stroke="#f43f5e" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#aRose)"/>
  <circle cx="1378" cy="575" r="7" fill="#f43f5e"/><text x="1378" y="578" text-anchor="middle" class="step">14</text>
  <text x="1368" y="568" class="lbl-rose" text-anchor="end">data: delta tokens</text>

  <!-- 15 LlmService -> AiController -->
  <line x1="460" y1="605" x2="274" y2="605" stroke="#16a34a" stroke-width="1.6" marker-end="url(#aGreen)"/>
  <circle cx="448" cy="605" r="7" fill="#16a34a"/><text x="448" y="608" text-anchor="middle" class="step">15</text>
  <text x="438" y="598" class="lbl-green" text-anchor="end">onToken / onSources / onStats</text>

  <!-- 16 AiController -> Browser -->
  <line x1="270" y1="632" x2="94" y2="632" stroke="#16a34a" stroke-width="1.6" marker-end="url(#aGreen)"/>
  <circle cx="258" cy="632" r="7" fill="#16a34a"/><text x="258" y="635" text-anchor="middle" class="step">16</text>
  <text x="180" y="624" class="lbl-green" text-anchor="middle">SSE: token / rag-trace / rag-stats / rag-sources</text>

  <!-- 17 Browser note -->
  <rect x="100" y="650" width="238" height="28" rx="7" fill="#ffffff" stroke="#86efac"/>
  <circle cx="114" cy="664" r="7" fill="#16a34a"/><text x="114" y="667" text-anchor="middle" class="step">17</text>
  <text x="128" y="668" font-size="9.5" fill="#166534">渲染打字机 + [n] 引用 + 来源列表</text>

  <!-- 18 LlmService -> ChatMemory save -->
  <line x1="460" y1="700" x2="1026" y2="700" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#aViolet)"/>
  <circle cx="472" cy="700" r="7" fill="#8b5cf6"/><text x="472" y="703" text-anchor="middle" class="step">18</text>
  <text x="482" y="693" class="lbl-violet">saveMessagePair(reply, sources, traceId)</text>

  <!-- 19 ChatMemory -> MySQL insert -->
  <line x1="1030" y1="732" x2="1206" y2="732" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#aViolet)"/>
  <circle cx="1042" cy="732" r="7" fill="#8b5cf6"/><text x="1042" y="735" text-anchor="middle" class="step">19</text>
  <text x="1052" y="725" class="lbl-violet">INSERT messages (+ sources_json)</text>

  <!-- 异步回写说明 -->
  <rect x="62" y="790" width="1398" height="60" rx="12" fill="#faf5ff" stroke="#c4b5fd" stroke-dasharray="6 4"/>
  <text x="80" y="812" font-size="10.5" font-weight="700" fill="#6d28d9">⑳ 异步回写</text>
  <text x="80" y="831" font-size="10" fill="#475569">VectorSaveEvent → vectorTaskExecutor → Embedding → SQLite 对话向量　·　SummaryUpdateEvent → summaryTaskExecutor → 摘要 → MySQL</text>
  <text x="80" y="846" font-size="9.5" fill="#64748b">可观测：rag-trace / rag-stats / rag-sources 事件 + rag_retrieval_log 审计日志；回写失败不影响主回答。</text>

  <!-- 页脚图例 -->
  <g font-size="9.5" fill="#64748b">
    <line x1="62" y1="876" x2="94" y2="876" stroke="#475569" stroke-width="1.5"/>
    <text x="100" y="879">同步调用 / 写入</text>
    <line x1="220" y1="876" x2="252" y2="876" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 4"/>
    <text x="258" y="879">返回</text>
    <line x1="310" y1="876" x2="342" y2="876" stroke="#16a34a" stroke-width="1.5"/>
    <text x="348" y="879">SSE / 浏览器</text>
    <line x1="460" y1="876" x2="492" y2="876" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="498" y="879">模型调用</text>
    <line x1="590" y1="876" x2="622" y2="876" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="628" y="879">消息回写</text>
    <text x="1460" y="879" text-anchor="end">检索阈值、重排与压缩见 application.properties 与《项目框架总览》4.4 节</text>
  </g>
</svg>
