name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Scan tracked files
        run: python scripts/secret_scan.py --tracked
      - name: Check sensitive config
        shell: pwsh
        run: ./scripts/check-sensitive-config.ps1
