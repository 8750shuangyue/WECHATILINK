version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:17"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      spring:
        patterns:
          - "org.springframework*"
          - "org.springframework.ai*"
      test:
        patterns:
          - "org.junit*"
          - "org.mockito*"
          - "org.assertj*"

  - package-ecosystem: maven
    directory: "/TEST"
    schedule:
      interval: weekly
      day: monday
      time: "03:17"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:17"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    labels:
      - dependencies
